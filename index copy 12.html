  <style>
    :root {
      /* Ramadan Premium Palette - Emerald & Gold */
      --bg-gradient-start: #064e3b;
      /* Deep Emerald */
      --bg-gradient-mid: #022c22;
      --bg-gradient-end: #01120f;

      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(245, 158, 11, 0.2);
      /* Golden border */
      --glass-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.6);

      --text-primary: #FFFFFF;
      --text-secondary: #d1d5db;
      --text-accent: #f59e0b;
      /* Vibrant Gold */
      --text-dim: rgba(255, 255, 255, 0.5);

      /* Clock Colors (Ramadan Theme) */
      --clock-face-bg: #f8fafc;
      --clock-text-color: #030404;
      --clock-hand-hour: #01110c;
      --clock-hand-minute: #0b2921;
      --clock-hand-second: #f59e0b;
      --clock-center-dot: #f59e0b;
      --hour-marker-color: #0000006c;
      --minute-marker-color: rgb(5, 5, 5);

      --font-primary: 'Changa', sans-serif;
      --font-secondary: 'Almarai', sans-serif;
      --font-display: 'El Messiri', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-secondary);
      background-color: var(--bg-gradient-mid);
      background-image:
        radial-gradient(circle at 50% 50%, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      padding: 0.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Top Section: Header & Clock */
    .top-section {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      /* Horizontal side-by-side */
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
      position: relative;
    }

    /* Container for the Main Clock to keep it square and centered */
    .top-section .clock-wrapper {
      flex: 0 0 auto;
      /* Only take the space needed for the square */
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .top-section .clock-wrapper .top-card {
      height: 100%;
      aspect-ratio: 1 / 1;
      width: auto;
      max-width: 100vw;
    }

    /* Consolidated Info Card (Bottom) */
    .top-section .info-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .top-section .info-wrapper .top-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem;
    }

    /* Make the countdown (which will be the 3rd child now) span both columns? 
       No, the user requested squares.
       However, we are removing the 3rd card. So we have 3 cards.
       1: Clock, 2: Info, 3: Countdown.
       If we want squares, maybe 3 squares in a row? No, screens are vertical.
       User approved "Digital Countdown span the full width".
       If it spans full width, it will be a rectangle.
       Let's proceed with making it span full width.
    */
    .top-section> :nth-child(3) {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      /* Allow rectangle for countdown */
      height: 80%;
      /* Fill the row height */
    }

    /* Cards in Top Section */
    .top-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 2rem;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 0.2rem;
      /* Square behavior for clock cards, rectangle for info */
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .top-section> :nth-child(3) {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      height: 80%;
    }

    /* Quadrant 1: Main Clock (Top Right usually in RTL, but grid items order is 1,2,3,4) */
    /* We will place them in order: MainClock, Info, NextClock, Countdown */

    .clock-container {
      width: 100%;
      height: 100%;
      /* Removed max-width to allow full fill if needed, or keep it to ensure roundness? 
         If user wants full card background white, we should apply background to card or make clock fill card.
         User said "background of the clock... full size of the card". 
      */
      max-width: none;
      aspect-ratio: auto;
      /* Let it stretch */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ghost Hands Style */
    .hand.ghost {
      opacity: 0.3;
      /* Faint */
      z-index: 5;
      /* Behind main hands */
      background-color: #98959561 !important;
      /* Force grey */
      /* Make them slightly thinner/shorter to distinguish? */
    }

    .hand.ghost-hour {
      width: 0.5rem;
      height: 25%;
    }

    .hand.ghost-minute {
      width: 0.3rem;
      height: 38%;
    }

    /* Quadrant 2: Info (Date + Weather) */
    .info-card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      height: 100%;
      width: 50%;
      text-align: center;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
    }

    /* Quadrant 4: Digital Countdown */
    .digital-countdown-large {
      display: flex;
      flex-direction: row;
      align-items: center;
      /* Center Vertically */
      justify-content: center;
      gap: 0.5rem;
      direction: ltr;
      /* Force LTR for numbers 12:45 */
      width: 100%;
      height: 100%;
      /* Fill height */
    }

    .digital-countdown-large .curr-time {
      font-size: 3rem;
      /* Increasedfrom 8rem */
      font-weight: 700;
      color: var(--text-accent);
      font-family: var(--font-display);
      line-height: 0.7;
      /* Drastically reduced */
      letter-spacing: -3px;
    }

    .consolidated-info-row {
      display: flex;
      flex-direction: row-reverse;
      /* Arabic RTL logic for visual balance? Or standard row? standard row. */
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-top: 1rem;
      border-top: 1px solid var(--glass-border);
      padding-top: 1rem;
    }

    .digital-countdown-large .labels-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 1rem;
    }


    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--clock-face-bg);
      border-radius: inherit;
      /* Inherit from card if direct child, or keep its own? Card has 2rem */
      /* We will set the Card to have the white bg for the main clock, and this to transparent? */
      /* Or make this fill completely. Let's make this fill completely. */
      /* If padding is 0, this needs to match card radius */
      border-radius: 20rem;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
      border: none;
      /* Border is on the card? Or keep border here? Use border on card. */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Modifiers for specific cards */
    .top-card.clock-card-full {
      padding: 0;
      background: var(--clock-face-bg);
      /* The card itself is white */
      border: 4px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .top-card.clock-card-full .clock-face {
      background: transparent;
      /* Card handles bg */
      box-shadow: none;
      /* Card handles shadow */
      width: 100%;
      height: 100%;
    }

    /* Keep internal clock elements mostly same but updated colors */
    .clock-face .number {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--clock-text-color);
      font-family: 'skia';
      z-index: 5;
      line-height: 1;
      text-shadow: none;
    }

    .number-12 {
      top: 13%;
      left: 50%;
    }

    .number-3 {
      top: 50%;
      left: 87%;
    }

    .number-6 {
      top: 87%;
      left: 50%;
    }

    .number-9 {
      top: 50%;
      left: 13%;
    }

    .marker-container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .marker {
      position: absolute;
      left: 50%;
      top: 3%;
      transform: translateX(-50%);
      border-radius: 0;
    }

    .minute-marker {
      width: 1px;
      height: 6%;
      background-color: var(--minute-marker-color);
    }

    .hour-marker {
      width: 4px;
      height: 12%;
      background-color: var(--hour-marker-color);
      box-shadow: 0 0 5px rgba(247, 180, 44, 0.5);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      border-radius: 50px;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .hour-hand {
      width: 0.8rem;
      height: 28%;
      background-color: var(--clock-hand-hour);
    }

    .minute-hand {
      width: 0.5rem;
      height: 38%;
      background-color: var(--clock-hand-minute);
    }

    .second-hand {
      width: 0.1rem;
      height: 45%;
      background-color: var(--clock-hand-second);
      z-index: 12;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--clock-center-dot);
      border-radius: 50%;
      border: 3px solid var(--clock-hand-hour);
      z-index: 13;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Date & Weather Styling (Side Info) */
    .info-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 1.5rem;
      border-radius: 1.5rem;
      backdrop-filter: blur(5px);
      min-width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .date-weekday {
      font-size: 5rem;
      font-weight: 700;
      color: var(--text-accent);
      font-family: var(--font-display);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .date-gregorian {
      font-size: 0rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .date-hijri {
      font-size: 3.5rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: var(--font-display);
      margin-bottom: 0.5rem;
    }


    /* Countdown */
    .countdown-container {
      margin-top: 2rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem 2rem;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
    }

    .digital-countdown {
      flex-direction: row;
      /* Horizontal now */
      gap: 1.5rem;
      direction: ltr;
      text-align: center;
    }

    .time-part {
      align-items: center;
      color: var(--text-primary);
    }

    .time-part .value {
      font-size: 4rem;
      font-weight: 700;
      font-family: 'Changa';
      color: var(--text-accent);
      line-height: 1;
      min-width: 2ch;
    }

    .time-part .label {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Removed Prayer Styles */

    /* Settings Button */
    .settings-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-dim);
      border: 1px solid var(--glass-border);
      width: 3.5rem;
      height: 3.5rem;
    }

    .settings-button:hover {
      background: var(--text-accent);
      color: #000;
      border-color: var(--text-accent);
    }

    /* 3D Prominent Clock Card */
    .clock-card-3d {
      background: var(--clock-face-bg) !important;
      border: 12px solid #1a1a1a !important;
      box-shadow:
        0 12px 0 #000,
        0 20px 40px rgba(0, 0, 0, 0.7),
        inset 0 0 20px rgba(0, 0, 0, 0.1) !important;
      transform: translateY(-8px);
      z-index: 10;
    }


    /* Mobile Landscape Optimization */
    @media screen and (orientation: landscape) and (max-height: 500px) {
      .app-container {
        padding: 0.5rem;
      }

      .top-section {
        gap: 0.1rem;
        height: 100%;
      }

      .top-section .clock-wrapper .top-card {
        max-width: none;
      }

      .top-section .info-wrapper .top-card {
        padding: 1rem;
      }

      .digital-countdown-large .curr-time {
        font-size: 7rem;
      }

      .date-weekday {
        font-size: 3rem !important;
      }

      .date-hijri {
        font-size: 2.2rem !important;
      }

      .date-gregorian {
        font-size: 0rem !important;
      }


      .top-card {
        border-radius: 2rem;
        width: 100%;
        height: 100%;
      }

      .clock-face .number {
        font-size: 3rem;
      }

    }
  </style>

        if (!navigator.onLine) {

  <script>
    // --- SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'prayer-app-v2';
          const ASSETS = [
            './',
            './index.html',
            './manifest.json',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.production.min.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
            'https://unpkg.com/babel-standalone@6/babel.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css',
            'https://fonts.googleapis.com/css2?family=Changa:wght@600;700&display=swap',
            'https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=El+Messiri:wght@400..700&display=swap'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => {
                return cache.addAll(ASSETS).catch(err => console.log('Caching assets failed', err));
              })
            );
          });

          self.addEventListener('fetch', (event) => {
            event.respondWith(
              caches.match(event.request).then((response) => {
                return response || fetch(event.request).then(fetchRes => {
                  return caches.open(CACHE_NAME).then(cache => {
                    // Cache new external requests on the fly (like fonts)
                    if (event.request.url.startsWith('http')) {
                      cache.put(event.request, fetchRes.clone());
                    }
                    return fetchRes;
                  });
                });
              }).catch(() => caches.match('./index.html'))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(err => console.log('SW failed', err));
      });
    }
  </script>

      let h = parseInt(hour, 10);
      h = h % 12;

    const usePrayerTimes = (currentTime) => {
      // Initialize state from local database or cache
      const [prayerTimes, setPrayerTimes] = React.useState(() => {
        const todayKey = getTodaysDateKey(currentTime);
        const customData = localStorage.getItem(`customPrayerTimes_${todayKey}`);

    const SettingsIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69.98l2.49 1c.23.09.49 0 .61.22l2-3.46c.12-.22-.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
      </svg>
    );

    // from components/AnalogClock.tsx
    const AnalogClock = ({ time, showSeconds = true, secondaryTime = null, bidRemaining = null }) => {
      const seconds = time.getSeconds();
      const minutes = time.getMinutes();
      const hours = time.getHours();

      const secondsRotation = (seconds / 60) * 360;
      const minutesRotation = (minutes / 60) * 360 + (seconds / 60) * 6;
      const hoursRotation = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

      // Secondary Time (Ghost Hands) - Frozen time
      let ghostMinutesRotation = 0;
      let ghostHoursRotation = 0;
      if (secondaryTime) {
        // No seconds usually for prayer times
        const sm = secondaryTime.getMinutes();
        const sh = secondaryTime.getHours();

        ghostMinutesRotation = (sm / 60) * 360;
        ghostHoursRotation = ((sh % 12) / 12) * 360 + (sm / 60) * 30;
      }

      return (
        <div className="clock-face">

          {/* Markers */}
          {Array.from({ length: 60 }).map((_, i) => {
            const isHourMark = i % 5 === 0;
            // The positions of numbers (12, 3, 6, 9) correspond to markers 0, 15, 30, 45
            const isNumberedHour = i === 0 || i === 15 || i === 30 || i === 45;

            return (
              <div
                key={`marker-${i}`}
                className="marker-container"
                style={{ transform: `rotate(${i * 6}deg)` }}
              >
                <div
                  className={isHourMark ? "marker hour-marker" : "marker minute-marker"}
                  style={{ borderRadius: 0, ...(isNumberedHour ? { height: '6%' } : {}) }}
                />
              </div>
            );
          })}

          {/* Numbers */}
          <div className="number number-12"> 12</div>
          <div className="number number-3">3</div>
          <div className="number number-6">6</div>
          <div className="number number-9">9</div>

          {/* Ghost Hands (Next Prayer) */}
          {secondaryTime && (
            <React.Fragment>
              <div
                className="hand ghost ghost-hour"
                style={{ transform: `translateX(-50%) rotate(${ghostHoursRotation}deg)` }}
              />
              <div
                className="hand ghost ghost-minute"
                style={{ transform: `translateX(-50%) rotate(${ghostMinutesRotation}deg)` }}
              />
            </React.Fragment>
          )}

          {/* Hands */}
          <div
            className="hand hour-hand"
            style={{ transform: `translateX(-50%) rotate(${hoursRotation}deg)` }}
          ></div>
          <div
            className="hand minute-hand"
            style={{ transform: `translateX(-50%) rotate(${minutesRotation}deg)` }}
          ></div>
          {showSeconds && (
            <div
              className="hand second-hand"
              style={{ transform: `translateX(-50%) rotate(${secondsRotation}deg)` }}
            ></div>
          )}
          <div className="center-dot"></div>
        </div>
      );
    };

    // from components/PrayerList.tsx
    const PrayerList = ({ prayerTimes, prayerOrder, nextPrayer }) => {
      return (
        <div className="prayer-list">
          {prayerOrder.map(name => {
            const isNext = nextPrayer === name;
            return (
              <div key={name} className={`prayer-card ${isNext ? 'next-prayer' : ''}`}>
                <span className="prayer-card-name">{prayerNamesArabic[name]}</span>
                <span className="prayer-card-time">
                  {formatTo12Hour(prayerTimes[name])}
                </span>
              </div>
            );
          })}
        </div>
      );
    };

    // from components/Countdown.tsx
    const Countdown = ({ countdownParts, large = false }) => {
      const h = parseInt(countdownParts.hours, 10);
      const m = parseInt(countdownParts.minutes, 10);
      const s = parseInt(countdownParts.seconds, 10);
      const totalSeconds = countdownParts.totalSeconds;

      let timeString = '';
      let isRed = false;

      if (totalSeconds <= 300) {
        // Less than or equal to 5 minutes
        timeString = `${m}:${String(s).padStart(2, '0')}`;
        isRed = true;
      } else {
        if (h > 0) {
          timeString = `${h}:${String(m).padStart(2, '0')}`;
        } else {
          timeString = `${m}`;
        }
      }

      if (large) {
        return (
          <div className="digital-countdown-large">
            <span className="curr-time" style={{ color: isRed ? '#ef4444' : 'var(--text-accent)' }}>
              {h > 0 && (
                <React.Fragment>
                  <span style={{ display: 'inline-block', minWidth: '1.2ch', textAlign: 'center' }}>{h}</span>
                  <span style={{ margin: '0 -0.1rem', opacity: 0.8 }}>:</span>
                </React.Fragment>
              )}
              <span style={{ display: 'inline-block', minWidth: (h > 0 || totalSeconds > 300) ? '2.2ch' : '1.2ch', textAlign: 'center' }}>
                {h > 0 || totalSeconds > 300 ? String(m).padStart(2, '0') : m}
              </span>
              {totalSeconds <= 300 && (
                <React.Fragment>
                  <span style={{ margin: '0 -0.1rem', opacity: 0.8 }}>:</span>
                  <span style={{ display: 'inline-block', minWidth: '2.2ch', textAlign: 'center' }}>
                    {String(s).padStart(2, '0')}
                  </span>
                </React.Fragment>
              )}
            </span>
          </div>
        );
      }

      return (
        <div className="countdown-container">
          <div className="digital-countdown" style={{ color: isRed ? '#ef4444' : 'inherit' }}>
            {h > 0 && (
              <div className="time-part hours">
                <span className="value" style={{ color: isRed ? '#ef4444' : 'var(--text-accent)' }}>{countdownParts.hours}</span>
                <span className="label">ساعة</span>
              </div>
            )}
            <div className="time-part minutes">
              <span className="value" style={{ color: isRed ? '#ef4444' : 'var(--text-accent)' }}>{countdownParts.minutes}</span>
              <span className="label">دقيقة</span>
            </div>
            {totalSeconds <= 300 && (
              <div className="time-part seconds">
                <span className="value" style={{ color: isRed ? '#ef4444' : 'var(--text-accent)' }}>{countdownParts.seconds}</span>
                <span className="label">ثانية</span>
              </div>
            )}
          </div>
        </div>
      );
    };

    // from components/DateDisplay.tsx
    const DateDisplay = ({ dateInfo }) => {
      return (
        <React.Fragment>
          <div className="date-weekday">{dateInfo.weekday}</div>
          <div className="date-gregorian">{dateInfo.gregorian}</div>
          <div className="date-hijri">{dateInfo.hijri}</div>
        </React.Fragment>
      );
    };


    // from components/EditTimesModal.tsx
    const EditTimesModal = ({ isOpen, onClose, initialTimes, onSave, todayKey, hijriAdjustment, onSaveAdjustment }) => {
      const [editedTimes, setEditedTimes] = React.useState(initialTimes);
      const [editedAdjustment, setEditedAdjustment] = React.useState(hijriAdjustment);

      React.useEffect(() => {
        if (isOpen) {
          setEditedTimes(initialTimes);
          setEditedAdjustment(hijriAdjustment);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleInputChange = (prayerName, value) => {
        setEditedTimes(prev => ({ ...prev, [prayerName]: value }));
      };

      const handleSave = () => {
        onSave(editedTimes);
        onSaveAdjustment(editedAdjustment);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex justify-center items-center z-[1000] text-base" onClick={onClose}>
          <div className="bg-white p-10 rounded-2xl border-4 border-[#2C2C2C] text-[#2C2C2C] w-[min(90vw,400px)] text-center max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <header className="text-2xl font-bold mb-8">الإعدادات</header>

            <div className="mb-8">
              <h3 className="text-xl font-bold mb-4 border-b pb-2">أوقات الصلاة</h3>
              <div className="space-y-4">
                {prayerOrder.map(name => (
                  <div key={name} className="flex justify-between items-center">
                    <label htmlFor={`time-${name}`} className="text-lg font-semibold">{prayerNamesArabic[name]}</label>
                    <input
                      type="time"
                      id={`time-${name}`}
                      value={editedTimes[name]}
                      onChange={(e) => handleInputChange(name, e.target.value)}
                      className="font-['Changa'] text-lg p-3 border-2 border-gray-300 rounded-xl"
                    />
                  </div>
                ))}
              </div>
            </div>

            <div className="mb-8 border-t pt-6">
              <h3 className="text-xl font-bold mb-4">تعديل التاريخ الهجري</h3>
              <p className="text-gray-600 mb-4 text-sm">يمكنك زيادة أو نقصان أيام من التاريخ الهجري</p>
              <div className="flex justify-center items-center gap-6">
                <button
                  onClick={() => setEditedAdjustment(prev => prev - 1)}
                  className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-full text-2xl font-bold transition-colors"
                >
                  -
                </button>
                <div className="flex flex-col">
                  <span className="text-3xl font-bold text-[#3A5A40]">
                    {editedAdjustment > 0 ? `+${editedAdjustment}` : editedAdjustment}
                  </span>
                  <span className="text-xs text-gray-500">يوم</span>
                </div>
                <button
                  onClick={() => setEditedAdjustment(prev => prev + 1)}
                  className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-full text-2xl font-bold transition-colors"
                >
                  +
                </button>
              </div>
            </div>

            <div className="mt-8 flex justify-center gap-4">
              <button onClick={handleSave} className="flex-1 py-4 font-['Changa'] text-lg rounded-2xl cursor-pointer border-none bg-[#3A5A40] text-white font-bold hover:bg-[#2F4934] transition-colors">حفظ التغييرات</button>
              <button onClick={onClose} className="flex-1 py-4 font-['Changa'] text-lg rounded-2xl cursor-pointer border-none bg-gray-200 text-gray-800 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
            </div>
          </div>
        </div>
      );
    };


    // from App.tsx
    const App = () => {
      const [time, setTime] = React.useState(new Date());
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [hijriAdjustment, setHijriAdjustment] = React.useState(() => {
        return parseInt(localStorage.getItem('hijriAdjustment') || '0', 10);
      });

      const [hijriInfo, setHijriInfo] = React.useState(() => {
        const cached = localStorage.getItem('cachedHijri');
        if (cached) return JSON.parse(cached);
        const today = new Date();
        const adj = parseInt(localStorage.getItem('hijriAdjustment') || '0', 10);
        const adjustedDate = new Date(today);
        adjustedDate.setDate(adjustedDate.getDate() + adj);

        // Formatter for fallback (client-side)
        const day = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn', { day: 'numeric' }).format(adjustedDate);
        const month = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { month: 'long' }).format(adjustedDate);

        return {
          formatted: `${day} ${month}`,
          day: adjustedDate.getDate()
        };
      });

      const fetchHijri = React.useCallback(async () => {
        try {
          if (!navigator.onLine && hijriInfo.day) return;
          const adjustedDate = new Date();
          adjustedDate.setDate(adjustedDate.getDate() + hijriAdjustment);
          const dateStr = adjustedDate.toLocaleDateString('en-GB').replace(/\//g, '-');
          const res = await fetch("https://api.aladhan.com/v1/gToH?date=" + dateStr);
          const data = await res.json();
          if (data.code === 200) {
            const h = data.data.hijri;
            const currentDay = parseInt(h.day, 10);
            const info = {
              formatted: `${h.day} ${h.month.ar}`, // Removed year/هـ as requested
              day: currentDay
            };
            setHijriInfo(info);
            localStorage.setItem('cachedHijri', JSON.stringify(info));
          }
        } catch (e) {
          console.warn("Hijri API failed");
        }
      }, [hijriAdjustment]); // Removed hijriInfo.day to focus on adjustment changes

      const handleSaveAdjustment = React.useCallback((newAdjustment) => {
        setHijriAdjustment(newAdjustment);
        localStorage.setItem('hijriAdjustment', newAdjustment.toString());

        // Recalculate Hijri immediately without waiting for effect/API
        const today = new Date();
        const adjustedDate = new Date(today);
        adjustedDate.setDate(adjustedDate.getDate() + newAdjustment);

        const day = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn', { day: 'numeric' }).format(adjustedDate);
        const month = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { month: 'long' }).format(adjustedDate);

        const info = {
          formatted: `${day} ${month}`,
          day: adjustedDate.getDate()
        };
        setHijriInfo(info);
        localStorage.setItem('cachedHijri', JSON.stringify(info));
      }, []);

      const {
        prayerTimes,
        loading: prayerLoading,
        error,
        countdownParts,
        handleSavePrayerTimes,
        todayKey,
      } = usePrayerTimes(time);

      React.useEffect(() => {
        const timerId = setInterval(() => setTime(new Date()), 1000);
        fetchHijri();
        window.addEventListener('online', fetchHijri);
        return () => {
          clearInterval(timerId);
          window.removeEventListener('online', fetchHijri);
        };
      }, [fetchHijri]);

      const dateInfo = React.useMemo(() => {
        const today = time;
        const dayNumber = today.getDate();
        return {
          weekday: new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(today) + ' ' + dayNumber,
          hijri: hijriInfo.formatted,
          gregorian: new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'numeric' }).format(today),
        };
      }, [time, hijriInfo]);

      // Identify next prayer
      const nextPrayerInfo = React.useMemo(() => {
        if (!prayerTimes) return null;
        const now = time;
        const times = prayerOrderForList.map(name => {
          const t = prayerTimes[name];
          if (!t) return null;
          const [h, m] = t.split(':').map(Number);
          const d = new Date(now);
          d.setHours(h, m, 0, 0);
          return { name, date: d };
        }).filter(x => x);

        // Find first prayer that is after now
        const next = times.find(p => p.date > now);

        if (next) return next;

        // If none found, return Fajr (conceptually tomorrow, but for clock display today's Fajr time is fine)
        const fajr = times.find(p => p.name === 'Fajr');
        return fajr;
      }, [time, prayerTimes]);

      const nextPrayerName = nextPrayerInfo ? nextPrayerInfo.name : null;
      const nextPrayerDate = nextPrayerInfo ? nextPrayerInfo.date : new Date();

      // Show loading indicator only if we have NO data and are still loading
      const showLoading = !prayerTimes && prayerLoading;
      const showError = !prayerTimes && error;

      return (
        <div className="app-container">
          <main className="main-panel">
            {/* Top Section: Vertical Flex */}
            <div className="top-section">

              {/* Top: Main Clock */}
              <div className="clock-wrapper">
                <div className="top-card clock-card-full clock-card-3d">
                  {showLoading && (
                    <div className="absolute inset-0 flex items-center justify-center bg-white/80 z-50 rounded-inherit">
                      <div className="text-emerald-900 font-bold">جاري التحميل...</div>
                    </div>
                  )}
                  {showError && (
                    <div className="absolute inset-x-0 top-0 p-4 bg-red-500/20 text-red-200 text-xs text-center z-50">
                      {error} - سيتم العرض عند توفر الاتصال
                    </div>
                  )}
                  <div className="clock-container">
                    <AnalogClock
                      time={time}
                      showSeconds={true}
                      secondaryTime={nextPrayerDate}
                    />
                  </div>
                </div>
              </div>

              {/* Bottom: Consolidated Info (Countdown + Date + Weather) */}
              <div className="info-wrapper">
                <div className="top-card">

                  {/* Info Row: Side-by-side components */}
                  <div style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '2rem' }}>

                    {/* Countdown Section - Now clickable for settings */}
                    {prayerTimes ? (
                      <div
                        style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', zIndex: 100 }}
                        onClick={() => setIsModalOpen(true)}
                        title="إعدادات"
                      >
                        <Countdown countdownParts={countdownParts} large={true} />
                      </div>
                    ) : (
                      <div style={{ color: 'var(--text-dim)', fontSize: '1rem', textAlign: 'center' }}>
                        المواقيت غير متوفرة حالياً
                      </div>
                    )}

                    {/* Date Section */}
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.5rem' }}>
                      <div className="date-weekday" style={{ position: 'static', fontSize: '4.5rem' }}>{dateInfo.weekday}</div>
                      <div className="date-hijri" style={{ position: 'static', fontSize: '3rem' }}>{dateInfo.hijri}</div>
                    </div>
                  </div>

                </div>
              </div>

            </div>

            {/* Removed Bottom Section */}


            {/* Hidden settings button for accessibility, primary access is via countdown click */}
            <button
              onClick={() => setIsModalOpen(true)}
              style={{ display: 'none' }}
              aria-label="Settings"
            >
              <SettingsIcon />
            </button>

            {prayerTimes && (
              <EditTimesModal
                isOpen={isModalOpen}
       onClose={() => setIsModalOpen(false)}
                initialTimes={prayerTimes}
                onSave={handleSavePrayerTimes}
                todayKey={todayKey}
                hijriAdjustment={hijriAdjustment}
                onSaveAdjustment={handleSaveAdjustment}
              />
            )}
          </main>
        </div>
      );
    };

    // from index.tsx
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
  </script>
</body>

</html>
