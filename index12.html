<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الصلاة - نيون ويدجت</title>
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;700&family=Changa:wght@400;700&family=Orbitron:wght@400;700&family=Roboto+Mono:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #02030a;
      --accent-cyan: #00f2ff;
      --accent-gold: #ffcc00;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-deep);
      background: radial-gradient(circle at center, #1a1c3a 0%, #02030a 100%);
      color: #fff;
      font-family: 'El Messiri', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ambient Glow */
    .glow {
      position: fixed;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(50px);
      animation: move 20s infinite alternate;
    }

    @keyframes move {
      from {
        transform: translate(-20%, -20%);
      }

      to {
        transform: translate(20%, 20%);
      }
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 1.5rem;
      width: 96vw;
      height: 92vh;
      padding: 1rem;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 2.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      overflow: hidden;
      /* Ensure children don't overflow */
    }

    /* Landscape Lock for iPad Portrait */
    @media screen and (max-width: 1024px) and (orientation: portrait) {
      body {
        justify-content: center;
        align-items: center;
      }

      .dashboard {
        transform: rotate(90deg);
        width: 95vh !important;
        height: 95vw !important;
        transform-origin: center;
      }
    }

    .card:hover {
      transform: translateY(-5px) scale(1.01);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 40px rgba(0, 242, 255, 0.15);
    }

    .label {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      opacity: 0.6;
    }

    /* Clock Widget */
    .clock-card {
      grid-row: span 2;
      background: rgba(0, 0, 0, 0.4);
    }

    .clock-outer {
      width: 95%;
      aspect-ratio: 1/1;
      border-radius: 20%;
      background: #050505;
      border: 2px solid #1a1a1a;
      position: relative;
      /* Prominent 3D Black Frame */
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.9),
        0 15px 0 #000,
        inset 0 0 20px rgba(0, 242, 255, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-face {
      position: relative;
      width: 95%;
      height: 95%;
      background: radial-gradient(circle at 30% 30%, #151515, #000);
      border-radius: 20%;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-marker {
      position: absolute;
      width: 2px;
      height: 100%;
      left: 50%;
      top: 0;
      margin-left: -1px;
      pointer-events: none;
    }

    .marker-tick {
      position: absolute;
      top: 5px;
      left: 0;
      width: 100%;
      border-radius: 2px;
    }

    .marker-tick.hour {
      height: 18px;
      width: 4px;
      left: -1px;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .marker-tick.minute {
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
    }

    .clock-number {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      color: #fff;
      font-weight: 700;
      transform: translate(-50%, -50%);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .clock-dot {
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at 30% 30%, #fff, #999);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    .clock-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      transform: translateX(-50%);
      border-radius: 20px;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      will-change: transform;
      backface-visibility: hidden;
    }

    .h-hand {
      width: 10px;
      height: 25%;
      background: linear-gradient(to top, #fff, #ccc);
    }

    .m-hand {
      width: 7px;
      height: 38%;
      background: linear-gradient(to top, var(--accent-cyan), #00b8c4);
    }

    .s-hand {
      width: 3px;
      height: 44%;
      background: #ff4d4d;
      z-index: 15;
    }

    /* Countdown Widget */
    .count-card {
      grid-column: span 2;
    }

    .count-timer {
      font-family: 'Roboto Mono', monospace;
      font-size: 8rem;
      font-weight: 700;
      color: var(--accent-cyan);
      line-height: 1;
      text-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
      font-variant-numeric: tabular-nums;
      min-width: 350px;
      text-align: center;
    }

    .count-p {
      font-size: 1.8rem;
      color: #888;
      margin-top: 1rem;
    }

    .prayer-active {
      color: var(--accent-gold);
      font-weight: 700;
    }

    /* Icon/Value styling */
    .big-val {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
    }

    .sub-val {
      font-size: 1.8rem;
      color: var(--accent-gold);
      margin-top: 0.5rem;
    }

    .date-large {
      font-size: 3rem;
      color: #eee;
      font-family: 'Roboto Mono', monospace;
    }

    .moon-age {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 0.5rem;
    }

    .digital-time {
      font-family: 'Roboto Mono', ;
      font-size: 3.5rem;
      color: #ffcc00;
      /* Gold as requested by user manual edit */
      margin-top: 1.5rem;
      font-variant-numeric: tabular-nums;
      min-width: 900px;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
    }

    .weather-ico {
      font-size: 7rem;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
    }

    /* Premium Weather Illustration Styles */
    .weather-container {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.5rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 2rem;
    }

    .svg-weather {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.2));
    }

    .sun-glow {
      animation: rotateSun 20s linear infinite;
      transform-origin: center;
    }

    .cloud-drift {
      animation: drift 4s ease-in-out infinite alternate;
    }

    .rain-drop {
      animation: rainFall 1.5s linear infinite;
    }

    @keyframes rainFall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform: translateY(20px);
        opacity: 0;
      }
    }

    /* Gradients for SVGs */
    .grad-sun {
      fill: url(#sunGrad);
    }

    .grad-cloud {
      fill: url(#cloudGrad);
    }

    .grad-rain {
      fill: url(#rainGrad);
    }

    .temp-val {
      font-family: 'Roboto Mono', monospace;
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }

    /* Settings Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      z-index: 2000;
      /* Ensure high z-index */
      display: none;
      /* Default hidden */
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #111;
      border: 2px solid var(--accent-cyan);
      border-radius: 2.5rem;
      padding: 2.5rem;
      width: 95%;
      max-width: 550px;
      color: #fff;
      box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .prayer-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 0.8rem;
    }

    .btn-adj {
      background: rgba(0, 242, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .btn-adj:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    .settings-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 3.5rem;
      height: 3.5rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--accent-cyan);
      font-size: 1.5rem;
      z-index: 1000;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .settings-btn:hover {
      transform: rotate(45deg) scale(1.1);
      box-shadow: 0 0 20px var(--accent-cyan);
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="dashboard">
    <!-- 1. Analog Clock -->
    <div class="card clock-card">
      <span class="label">الوقت الحالي</span>
      <div class="clock-outer">
        <div class="clock-face" id="clockFace">
          <!-- Numbers and Markers will be injected here -->
          <div id="hour" class="clock-hand h-hand"></div>
          <div id="min" class="clock-hand m-hand"></div>
          <div id="sec" class="clock-hand s-hand"></div>
          <div class="clock-dot"></div>
        </div>
      </div>
      <div id="digitalTime" class="digital-time">00:00:00</div>
    </div>

    <!-- 2. Countdown -->
    <div class="card count-card">
      <span class="label">العد التنازلي للأذان</span>
      <div id="countdown" class="count-timer">00:00</div>
      <div class="count-p">بقي لأذان <span id="nextPrayerName" class="prayer-active">...</span></div>
    </div>

    <!-- 3. Hijri -->
    <div class="card">
      <span class="label">التاريخ الهجري</span>
      <div id="hijriDay" class="big-val">--</div>
      <div id="hijriMonth" class="sub-val">...</div>
    </div>

    <!-- 4. Weather -->
    <div class="card">
      <span class="label">حالة الطقس</span>
      <div id="weatherGraphic" class="weather-container">
        <!-- SVG injected here -->
      </div>
      <div id="temp" class="temp-val">--°</div>

      <!-- Defs for Gradients -->
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fff176;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:1" />
          </linearGradient>
          <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#90a4ae;stop-opacity:1" />
          </linearGradient>
          <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0288d1;stop-opacity:1" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- 5. Date -->
    <div class="card">
      <span class="label">التقويم اليومي</span>
      <div id="dayName" class="big-val" style="font-size: 3.5rem;">...</div>
      <div id="gregorian" class="date-large">--/--</div>
    </div>

    <!-- 6. Moon -->
    <div class="card">
      <span class="label">حالة القمر</span>
      <div id="moonIcon" class="big-val" style="color: var(--accent-gold); font-size: 5rem;">🌑</div>
      <div id="moonPhaseName" class="sub-val">...</div>
      <div id="moonAge" class="moon-age">...</div>
    </div>
  </div>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <h2
        style="font-size: 2.2rem; margin-bottom: 2rem; text-align: center; color: var(--accent-cyan); font-weight: 700;">
        <i class="fas fa-sliders-h" style="margin-left: 10px;"></i>الإعدادات
      </h2>

      <!-- Hijri Section -->
      <div class="settings-row"
        style="background: rgba(255, 204, 0, 0.05); padding: 1.2rem; border-radius: 1.5rem; border: 1px solid rgba(255, 204, 0, 0.2); margin-bottom: 2rem;">
        <span style="font-size: 1.3rem; color: var(--accent-gold); font-weight: 700;">تعديل التاريخ الهجري</span>
        <div style="display: flex; gap: 1.2rem; align-items: center;">
          <button class="btn-adj" onclick="adjustSetting('hijri', -1)"
            style="border-color: var(--accent-gold); color: var(--accent-gold);">-</button>
          <span id="adjHijri"
            style="font-family: 'Roboto Mono'; font-size: 1.8rem; font-weight: 700; min-width: 40px; text-align: center;">0</span>
          <button class="btn-adj" onclick="adjustSetting('hijri', 1)"
            style="border-color: var(--accent-gold); color: var(--accent-gold);">+</button>
        </div>
      </div>

      <h3 style="font-size: 1.5rem; margin-bottom: 1rem; color: #aaa; text-align: right; padding-right: 0.5rem;">أوقات
        الصلاة (تعديل بالدقائق)</h3>

      <!-- Prayer List Container -->
      <div id="prayerSettingsList">
        <!-- Will be populated by JS -->
      </div>

      <div class="settings-row" style="margin-top: 1rem;">
        <span>تعديل عام للمواقيت (كل الصلوات)</span>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button class="btn-adj" onclick="adjustSetting('prayer', -1)">-</button>
          <span id="adjPrayer" style="font-family: 'Roboto Mono'; font-size: 1.4rem;">0</span>
          <button class="btn-adj" onclick="adjustSetting('prayer', 1)">+</button>
        </div>
      </div>

      <button onclick="closeSettings()"
        style="width: 100%; padding: 1.2rem; border-radius: 1.2rem; background: var(--accent-cyan); color: #000; font-size: 1.3rem; font-weight: 700; cursor: pointer; border: none; margin-top: 1.5rem; box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2); transition: all 0.3s;">
        حفظ وإغلاق
      </button>
    </div>
  </div>

  <div class="settings-btn" onclick="openSettings()">
    <i class="fas fa-cog"></i>
  </div>

  <script>
    // Constants & Config
    const LAT = 40.972;
    const LON = 28.732;
    const PRAYER_NAMES = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const AR_PRAYERS = {
      Fajr: 'الفجر', Sunrise: 'الشروق', Dhuhr: 'الظهر',
      Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء'
    };

    let prayerTimings = null;
    let hijriAdjustment = parseInt(localStorage.getItem('hijriAdj') || '0');
    let prayerAdjustment = parseInt(localStorage.getItem('prayerAdj') || '0');
    let individualOffsets = JSON.parse(localStorage.getItem('indParsAdj') || '{"Fajr":0,"Dhuhr":0,"Asr":0,"Maghrib":0,"Isha":0}');

    // 0. Initialize Clock UI
    function initClockUI() {
      const face = document.getElementById('clockFace');

      // Create Markers
      for (let i = 0; i < 60; i++) {
        const marker = document.createElement('div');
        marker.className = 'clock-marker';
        marker.style.transform = `rotate(${i * 6}deg)`;

        const tick = document.createElement('div');
        tick.className = i % 5 === 0 ? 'marker-tick hour' : 'marker-tick minute';
        marker.appendChild(tick);
        face.appendChild(marker);
      }

      // Create Numbers
      for (let i = 1; i <= 12; i++) {
        const num = document.createElement('div');
        num.className = 'clock-number';
        num.textContent = i;

        const angle = (i * 30) * (Math.PI / 180);
        const radius = face.offsetWidth / 2 - 45; // Adjust 45 based on padding/size
        const x = Math.sin(angle) * (radius);
        const y = -Math.cos(angle) * (radius);

        // We use CSS for positioning after calculation if we want specific radius
        // But simpler: just use absolute with top/left
        num.style.left = `calc(50% + ${x}px)`;
        num.style.top = `calc(50% + ${y}px)`;

        face.appendChild(num);
      }
    }

    // 1. Clock Logic
    function updateClock() {
      const now = new Date();
      const s = now.getSeconds();
      const m = now.getMinutes();
      const h = now.getHours();

      document.getElementById('sec').style.transform = `translateX(-50%) rotate(${s * 6}deg)`;
      document.getElementById('min').style.transform = `translateX(-50%) rotate(${m * 6}deg)`;
      document.getElementById('hour').style.transform = `translateX(-50%) rotate(${h * 30 + m / 2}deg)`;

      document.getElementById('digitalTime').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      updateCountdown(now);
    }

    // 2. Data Fetchers
    async function fetchData() {
      const now = new Date();
      // Apply Hijri adjustment
      const hDate = new Date(now);
      hDate.setDate(hDate.getDate() + hijriAdjustment);
      const dateStr = hDate.toLocaleDateString('en-GB').replace(/\//g, '-');

      try {
        // Prayers
        const pRes = await fetch(`https://api.aladhan.com/v1/timings/${Math.floor(Date.now() / 1000)}?latitude=${LAT}&longitude=${LON}&method=13`);
        const pData = await pRes.json();
        if (pData.code === 200) {
          // Apply prayer adjustment
          const t = pData.data.timings;
          for (let k in t) {
            if (!['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].includes(k)) continue;

            const [h, m] = t[k].split(':').map(Number);
            const totalAdj = prayerAdjustment + (individualOffsets[k] || 0);

            const d = new Date();
            d.setHours(h, m + totalAdj, 0, 0);
            t[k] = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          }
          prayerTimings = t;
        }

        // Hijri
        const hRes = await fetch(`https://api.aladhan.com/v1/gToH?date=${dateStr}`);
        const hData = await hRes.json();
        if (hData.code === 200) {
          document.getElementById('hijriDay').textContent = hData.data.hijri.day;
          document.getElementById('hijriMonth').textContent = hData.data.hijri.month.ar;
        }

        // Weather
        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code`);
        const wData = await wRes.json();
        if (wData.current) {
          document.getElementById('temp').textContent = Math.round(wData.current.temperature_2m) + '°';
          const code = wData.current.weather_code;
          const target = document.getElementById('weatherGraphic');

          if (code === 0) {
            target.innerHTML = `
              <svg class="svg-weather" viewBox="0 0 100 100">
                <circle class="sun-glow grad-sun" cx="50" cy="50" r="25" />
                <g class="sun-glow">
                  ${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<rect x="47" y="10" width="6" height="15" rx="3" fill="#fbc02d" transform="rotate(${a} 50 50)"/>`).join('')}
                </g>
              </svg>`;
          } else if (code <= 3) {
            target.innerHTML = `
              <svg class="svg-weather" viewBox="0 0 100 100">
                <circle cx="65" cy="40" r="15" fill="#fbc02d" opacity="0.8"/>
                <path class="cloud-drift grad-cloud" d="M25 70 Q25 50 45 50 Q50 35 65 40 Q85 40 85 60 Q85 75 70 75 L30 75 Q25 75 25 70 Z" />
              </svg>`;
          } else if (code >= 51) {
            target.innerHTML = `
              <svg class="svg-weather" viewBox="0 0 100 100">
                <path class="grad-cloud" d="M25 60 Q25 40 45 40 Q50 25 65 30 Q85 30 85 50 Q85 65 70 65 L30 65 Q25 65 25 60 Z" />
                <rect class="rain-drop grad-rain" x="35" y="70" width="3" height="10" rx="2" />
                <rect class="rain-drop grad-rain" x="50" y="75" width="3" height="10" rx="2" style="animation-delay:0.2s"/>
                <rect class="rain-drop grad-rain" x="65" y="70" width="3" height="10" rx="2" style="animation-delay:0.4s"/>
              </svg>`;
          } else {
            target.innerHTML = `
              <svg class="svg-weather" viewBox="0 0 100 100">
                <path class="grad-cloud" d="M25 70 Q25 50 45 50 Q50 35 65 40 Q85 40 85 60 Q85 75 70 75 L30 75 Q25 75 25 70 Z" />
              </svg>`;
          }
        }

        // Moon Phase Simple Calc
        updateMoon(now);

        // Basic Date
        document.getElementById('dayName').textContent = new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(now);
        document.getElementById('gregorian').textContent = `${now.getDate()}/${now.getMonth() + 1}`;

      } catch (e) {
        console.error("Fetch failed", e);
      }
    }

    function updateMoon(date) {
      // Simple Luni-solar approx
      const lp = 2551443;
      const now = date.getTime();
      const newMoon = new Date(1970, 0, 7, 20, 35, 0).getTime();
      const phase = ((now - newMoon) % lp) / lp;
      const age = phase * 29.53;

      let icon = '🌑'; let name = 'محاق';
      if (age < 1.84) { icon = '🌑'; name = 'محاق'; }
      else if (age < 5.53) { icon = '🌒'; name = 'هلال'; }
      else if (age < 9.22) { icon = '🌓'; name = 'تربيع أول'; }
      else if (age < 12.91) { icon = '🌔'; name = 'أحدب متزايد'; }
      else if (age < 16.60) { icon = '🌕'; name = 'بدر'; }
      else if (age < 20.28) { icon = '🌖'; name = 'أحدب متناقص'; }
      else if (age < 23.97) { icon = '🌗'; name = 'تربيع ثاني'; }
      else if (age < 27.66) { icon = '🌘'; name = 'هلال متناقص'; }
      else { icon = '🌑'; name = 'محاق'; }

      document.getElementById('moonIcon').textContent = icon;
      document.getElementById('moonPhaseName').textContent = name;
      document.getElementById('moonAge').textContent = `عمر القمر: ${age.toFixed(1)} يوم`;
    }

    // Settings Logic
    function openSettings() {
      document.getElementById('adjHijri').textContent = (hijriAdjustment > 0 ? '+' : '') + hijriAdjustment;
      document.getElementById('adjPrayer').textContent = (prayerAdjustment > 0 ? '+' : '') + prayerAdjustment;

      const list = document.getElementById('prayerSettingsList');
      list.innerHTML = '';

      const mainPrayers = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
      mainPrayers.forEach(p => {
        const row = document.createElement('div');
        row.className = 'prayer-list-item';

        const timeVal = prayerTimings ? prayerTimings[p] : '--:--';
        const off = individualOffsets[p] || 0;

        row.innerHTML = `
          <div style="display:flex; flex-direction:column;">
            <span style="font-weight:700; color:#fff;">${AR_PRAYERS[p]}</span>
            <span style="font-family:'Roboto Mono'; font-size:1.1rem; color:var(--accent-cyan);">${timeVal}</span>
          </div>
          <div style="display: flex; gap: 0.8rem; align-items: center;">
            <button class="btn-adj" onclick="adjustInd('${p}', -1)">-</button>
            <span id="off-${p}" style="font-family: 'Roboto Mono'; font-size: 1.2rem; min-width:30px; text-align:center;">${off > 0 ? '+' : ''}${off}</span>
            <button class="btn-adj" onclick="adjustInd('${p}', 1)">+</button>
          </div>
        `;
        list.appendChild(row);
      });

      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
      fetchData();
    }

    function adjustInd(p, val) {
      individualOffsets[p] = (individualOffsets[p] || 0) + val;
      localStorage.setItem('indParsAdj', JSON.stringify(individualOffsets));
      const el = document.getElementById(`off-${p}`);
      const off = individualOffsets[p];
      el.textContent = (off > 0 ? '+' : '') + off;
    }

    function adjustSetting(type, val) {
      if (type === 'hijri') {
        hijriAdjustment += val;
        localStorage.setItem('hijriAdj', hijriAdjustment);
        document.getElementById('adjHijri').textContent = (hijriAdjustment > 0 ? '+' : '') + hijriAdjustment;
      } else {
        prayerAdjustment += val;
        localStorage.setItem('prayerAdj', prayerAdjustment);
        document.getElementById('adjPrayer').textContent = (prayerAdjustment > 0 ? '+' : '') + prayerAdjustment;
      }
    }

    // 3. Countdown Logic
    function updateCountdown(now) {
      if (!prayerTimings) return;

      let next = null;
      for (let name of PRAYER_NAMES) {
        const [h, m] = prayerTimings[name].split(':').map(Number);
        const pDate = new Date(now);
        pDate.setHours(h, m, 0, 0);
        if (pDate > now) {
          next = { name, date: pDate };
          break;
        }
      }

      if (!next) {
        const [h, m] = prayerTimings.Fajr.split(':').map(Number);
        const pDate = new Date(now);
        pDate.setDate(pDate.getDate() + 1);
        pDate.setHours(h, m, 0, 0);
        next = { name: 'Fajr', date: pDate };
      }

      const diff = next.date - now;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      if (h > 0) {
        document.getElementById('countdown').textContent = `${h}:${m.toString().padStart(2, '0')}`;
      } else {
        document.getElementById('countdown').textContent = `${m}:${s.toString().padStart(2, '0')}`;
      }
      document.getElementById('nextPrayerName').textContent = AR_PRAYERS[next.name];
    }

    // Initialize
    initClockUI();
    updateClock();
    setInterval(updateClock, 1000);

    // Immediate fetch
    fetchData().then(() => {
      console.log("Initial data loaded");
    });

    setInterval(fetchData, 1800000); 
  </script>
