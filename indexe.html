  <style>
    /* ==========================================================================
       1. المتغيرات والنمط الأساسي (CSS Variables & Base Reset)
       ========================================================================== */
    :root {
      --bg-gradient-start: #0f2027;
      --bg-gradient-mid: #203a43;
      --bg-gradient-end: #2c5364;

      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

      --text-primary: #FFFFFF;
      --text-secondary: #E0E0E0;
      --text-accent: #fbff8f; /* ذهبي */
      --text-dim: rgba(255, 255, 255, 0.6);

      --font-primary: 'Changa', sans-serif;
      --font-secondary: 'Almarai', sans-serif;
      --font-display: 'El Messiri', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-secondary);
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      padding: 1rem;
      display: flex;
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
    }
    
    .app-container.rotated-90 {
      transform: rotate(90deg);
      width: 100vh;
      height: 100vw;
    }

    .main-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
      position: relative;
      direction: rtl;
    }

    .top-banner-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      direction: rtl;
    }

    .top-info-card {
      background: rgba(10, 20, 32, 0.88);
      border: 2.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      border-radius: 1.4rem;
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.6rem 1.2rem;
      height: 6.8rem;
    }

    .gregorian-date-card {
      gap: 1rem;
    }

    .date-weekday-text {
      font-family: 'Lemonada', cursive;
      font-size: clamp(5.8rem, 6.8vw, 7.6rem);
      font-weight: 800;
      color: #00e5ff;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    .date-gregorian-text {
      font-size: clamp(3.2rem, 4.6vw, 5.5rem);
      font-weight: 900;
      color: #ffffff;
      direction: ltr;
      unicode-bidi: plaintext;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    .hijri-date-card .hijri-date-box {
      font-size: clamp(4.2rem, 5.6vw, 6.5rem);
      font-weight: 900;
      text-align: center;
      line-height: 1;
      display: flex;
      gap: 0.8rem;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    .hijri-day-text {
      color: #ffd700;
    }

    .hijri-month-text {
      color: #76d7c4;
    }

    .weather-badge-inside {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 1.2rem;
      padding: 0.5rem 1.6rem;
      margin-top: 0.2rem;
      margin-bottom: auto;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
    }

    .weather-badge-inside .weather-area {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 4rem;
    }

    .weather-badge-inside .weather-icon {
      font-size: clamp(5.4rem, 6.8vw, 6.5rem);
      color: #ffd700;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.5));
    }

    .weather-badge-inside .weather-temp {
      font-size: clamp(4rem, 5.2vw, 6rem);
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    .bottom-dashboard-grid {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      gap: 0.6rem;
      direction: rtl;
    }

    .side-prayers-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
      height: 100%;
    }

    .center-countdown-panel {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .prayer-card {
      background: rgba(10, 20, 32, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      border-radius: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0.3rem;
      margin: 0;
      width: 100%;
      flex: 1;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      backdrop-filter: blur(12px);
    }

    .prayer-card.next-prayer {
      background: rgba(247, 180, 44, 0.25);
      border: 2.5px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
      transform: scale(1.02);
    }

    .prayer-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .prayer-card-name {
      font-size: clamp(2.5rem, 3.2vw, 3.8rem);
      font-weight: 800;
      font-family: var(--font-display);
      color: #ffca28;
      margin-bottom: 0rem;
      line-height: 1.1;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .prayer-card-time {
      font-size: clamp(4.8rem, 6.6vw, 7.5rem);
      font-weight: 900;
      font-family: var(--font-primary);
      color: #ffffff;
      direction: ltr;
      line-height: 0.9;
      white-space: nowrap;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    .next-prayer-countdown-card {
      background: rgba(10, 20, 32, 0.9);
      border: 2px solid rgba(255, 215, 0, 0.4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      border-radius: 1.5rem;
      backdrop-filter: blur(14px);
      position: relative;
      width: 100%;
      height: 100%;
      padding: 1rem 0.6rem 0.6rem 0.6rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      direction: rtl;
      flex: 1;
      overflow: hidden;
    }

    .next-prayer-label {
              position: absolute;

      font-size: clamp(2rem, 3.2vw, 3.8rem);
      font-weight: 900;
      color: #f3ecc2;
      line-height: 1.2;

      top: 40%;
      white-space: nowrap;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      margin-top: 0.4rem;
      margin-bottom: 0.6rem;
    }

    .countdown-wrapper {
      direction: ltr;
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .digital-countdown-large {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      direction: ltr;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .digital-countdown-large .curr-time {
      font-size: clamp(10rem, 20vw, 20rem);
      font-weight: 900;
      color: #ffee58;
      font-family: 'Fjalla One', sans-serif;
      line-height: 0.85;
      letter-spacing: -2px;
      position: relative;
      display: inline-block;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.7);
    }

    .prayer-card.next-prayer .prayer-card-name {
      color: var(--text-accent);
    }

    .prayer-card.next-prayer .prayer-card-time {
      color: var(--text-accent);
      text-shadow: 0 0 15px rgba(247, 180, 44, 0.4);
    }


    /* ==========================================================================
       8. العناصر الإضافية والإعدادات (Additional Controls & Settings)
       ========================================================================== */
    .bid-counter-circle {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      width: 3.2rem;
      height: 3.2rem;
      background: var(--clock-face-bg);
      border: 4px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #1a1a1a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 100;
    }

    .bid-counter-value {
      font-weight: 800;
      font-size: 1.2rem;
      line-height: 1;
      font-family: var(--font-primary);
    }

    .bid-counter-label {
      font-size: 0.5rem;
      color: #666;
      font-weight: 700;
      margin-top: -1px;
    }

    .settings-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-dim);
      border: 1px solid var(--glass-border);
      width: 3.5rem;
      height: 3.5rem;
    }

    .settings-button:hover {
      background: var(--text-accent);
      color: #000;
      border-color: var(--text-accent);
    }

      <script>
        const loadingText = document.getElementById('loading-text');

        setTimeout(() => {
          if (!window.React) {
            loadingText.innerText = "تعذر تحميل ملفات التشغيل";

        }, 8000);

        // Don't reload the whole page when online, React components handle their own data retry
        if (!navigator.onLine) {
          statusText.innerText = "أنت غير متصل بالإنترنت. سيتم عرض البيانات المخزنة مسبقاً.";
        }
      </script>
    </div>

  <script>
    // --- SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'prayer-times-v1';
          const ASSETS = [
            '${window.location.href}',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.development.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
            'https://unpkg.com/babel-standalone@6/babel.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
            );
          });

          self.addEventListener('fetch', (event) => {
            event.respondWith(
              caches.match(event.request).then((response) => {
                return response || fetch(event.request);
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(err => console.log('SW failed', err));
      });
    }
  </script>

    };
    const prayerOrder = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const prayerOrderForList = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

    // from utils/time.ts
    const getTodaysDateKey = (date = new Date()) => {
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const day = date.getDate().toString().padStart(2, '0');
      return `${month}-${day}`;
    };
    const formatTo12Hour = (timeString) => {
      if (!timeString || !timeString.includes(':')) return timeString;
      const [hour, minute] = timeString.split(':');
      let h = parseInt(hour, 10);
      h = h % 12;
      h = h ? h : 12; // The hour '0' should be '12'
      const hourStr = String(h).padStart(1, '0');
      return `${hourStr}:${minute}`;
    };

    // Helper to calculate time differences
    const addMinutesToTimeStr = (timeStr, minutes) => {
      if (!timeStr || !timeStr.includes(':')) return timeStr;
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      d.setMinutes(d.getMinutes() + minutes);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    const getPrayerOffsets = () => {
      try {
        return JSON.parse(localStorage.getItem('prayerOffsets') || '{}');
      } catch {
        return {};
      }
    };

    const applyOffsets = (timings) => {
      if (!timings) return timings;
      const offsets = getPrayerOffsets();
      const adjusted = { ...timings };
      Object.keys(offsets).forEach(prayer => {
        if (adjusted[prayer]) {
          adjusted[prayer] = addMinutesToTimeStr(adjusted[prayer], offsets[prayer]);
        }
      });
      return adjusted;
    };

    const DEFAULT_PRAYER_TIMES = {
      Fajr: "03:37",
      Sunrise: "05:16",
      Dhuhr: "12:08",
      Asr: "15:54",
      Maghrib: "19:00",
      Isha: "20:30"
    };

    // from hooks/usePrayerTimes.ts
    const usePrayerTimes = (currentTime) => {
      const todayKey = React.useMemo(() => getTodaysDateKey(currentTime), [currentTime]);
      
      const [basePrayerTimes, setBasePrayerTimes] = React.useState(() => {
        const cached = localStorage.getItem(`cachedPrayerTimes_${todayKey}`);
        return cached ? JSON.parse(cached) : DEFAULT_PRAYER_TIMES;
      });

      const [prayerTimes, setPrayerTimes] = React.useState(() => applyOffsets(basePrayerTimes));
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [nextPrayerCountdown, setNextPrayerCountdown] = React.useState(0);
      const [countdownMode, setCountdownMode] = React.useState('normal');

      const fetchPrayerTimes = React.useCallback(() => {
        if (localStorage.getItem(`customPrayerTimes_${todayKey}`)) {
            setPrayerTimes(JSON.parse(localStorage.getItem(`customPrayerTimes_${todayKey}`)));
            setLoading(false);
            return;
        }
        if (typeof PRAYER_DATABASE !== 'undefined' && PRAYER_DATABASE[todayKey]) {
            setPrayerTimes(PRAYER_DATABASE[todayKey]);
            setLoading(false);
            return;
        }
        setLoading(false);
      }, [todayKey]);

      React.useEffect(() => {
        fetchPrayerTimes();
        window.addEventListener('online', fetchPrayerTimes);
        return () => window.removeEventListener('online', fetchPrayerTimes);
      }, [fetchPrayerTimes]);

      // Calculate Next Prayer and Countdown
      React.useEffect(() => {
        if (!prayerTimes) return;

        const now = currentTime || new Date();

        const prayerDates = prayerOrder.map(name => {
          const timeStr = prayerTimes[name];
          if (!timeStr) return null;
          
          const parts = timeStr.split(':');
          if (parts.length >= 2) {
              const h = parseInt(parts[0], 10);
              const m = parseInt(parts[1], 10);
              const date = new Date(now);
              date.setHours(h, m, 0, 0);
              return { name, date };
          }
          return null;
        }).filter(p => p !== null);

        let elapsedPrayer = null;
        for (const prayer of prayerDates) {
            const diff = now.getTime() - prayer.date.getTime();
            if (diff >= 0 && diff <= 20 * 60 * 1000) {
                elapsedPrayer = diff;
                break;
            }
        }

        if (elapsedPrayer !== null) {
            setCountdownMode('elapsed');
            setNextPrayerCountdown(elapsedPrayer);
            return;
        }

        let nextPrayerTime = null;
        for (const prayer of prayerDates) {
          if (prayer.date > now) {
            nextPrayerTime = prayer.date;
            break;
          }
        }

        if (!nextPrayerTime && prayerDates.length > 0) {
          nextPrayerTime = new Date(prayerDates[0].date);
          nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        }

        if (nextPrayerTime) {
          const diff = nextPrayerTime.getTime() - now.getTime();
          setNextPrayerCountdown(diff);
          setCountdownMode(diff <= 5 * 60 * 1000 ? 'imminent' : 'normal');
        }

      }, [currentTime, prayerTimes]);

      const handleSavePrayerTimes = React.useCallback((newTimes) => {
        // Calculate new offsets based on the base API times
        if (!basePrayerTimes) return; // Prevent saving if no base internet times
        
        const offsets = getPrayerOffsets();
        
        Object.keys(newTimes).forEach(prayer => {
          const base = basePrayerTimes[prayer];
          const updated = newTimes[prayer];
          if (base && updated) {
            const [h1, m1] = base.split(':').map(Number);
            const [h2, m2] = updated.split(':').map(Number);
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff !== 0) {
              offsets[prayer] = diff;
            } else {
              delete offsets[prayer];
            }
          }
        });
        
        localStorage.setItem('prayerOffsets', JSON.stringify(offsets));
        setPrayerTimes(applyOffsets(basePrayerTimes));
      }, [basePrayerTimes]);

      const countdownParts = React.useMemo(() => {
        const totalSeconds = Math.max(0, Math.floor(nextPrayerCountdown / 1000));
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        return {
            hours: String(hrs),
            minutes: String(mins).padStart(2, '0'),
            seconds: String(secs).padStart(2, '0'),
            totalSeconds,
            mode: countdownMode
        };
      }, [nextPrayerCountdown, countdownMode]);

      return {
        prayerTimes,
        loading,
        error,
        countdownParts,
        handleSavePrayerTimes,
        todayKey
      };
    };

      );
    };

    // from components/PrayerList.tsx
    const PrayerList = ({ prayerTimes, prayerOrder, nextPrayer }) => {
      return (
        <div className="prayer-list">
          {prayerOrder.map(name => {
            const isNext = nextPrayer === name;
            return (
              <div key={name} className={`prayer-card ${isNext ? 'next-prayer' : ''}`}>
                <span className="prayer-card-name">{prayerNamesArabic[name]}</span>
                <span className="prayer-card-time">
                  {formatTo12Hour(prayerTimes[name])}
                </span>
              </div>
            );
          })}
        </div>
      );
    };

    // from components/Countdown.tsx
    const Countdown = ({ countdownParts, large = false }) => {
        const { mode, hours, minutes, seconds } = countdownParts;

        let color = 'var(--text-accent)';
        let displayTime = '';

        if (mode === 'imminent') {
            color = '#ff4444'; // Bright Red
            const m = parseInt(minutes, 10);
            displayTime = `${m}:${seconds}`;
        } else if (mode === 'elapsed') {
            color = '#22c55e'; // Green
            const m = parseInt(minutes, 10);
            displayTime = `${m}:${seconds}`;
        } else {
            // Normal
            const h = parseInt(hours, 10);
            // Show H:MM
            displayTime = `${h}:${minutes}`;
        }

        if (large) {
            return (
                <div className="digital-countdown-large">
                    <span className="curr-time" style={{ color }}>{displayTime}</span>
                </div>
            );
        }

        return (
            <div className="countdown-container">
                <div className="digital-countdown" style={{ color }}>
                    <div className="time-part hours">
                        <span className="value">{mode === 'normal' ? hours : minutes}</span>
                        <span className="label">{mode === 'normal' ? 'ساعة' : 'دقيقة'}</span>
                    </div>
                    {(mode === 'normal' || mode === 'elapsed' || mode === 'imminent') && (
                        <div className="time-part minutes">
                            <span className="value">{mode === 'normal' ? minutes : seconds}</span>
                            <span className="label">{mode === 'normal' ? 'دقيقة' : 'ثانية'}</span>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // from components/DateDisplay.tsx
    const DateDisplay = ({ dateInfo }) => {
      return (
        <React.Fragment>
          <div className="date-weekday">{dateInfo.weekday}</div>
          <div className="date-gregorian">{dateInfo.gregorian}</div>
          <div className="date-hijri">{dateInfo.hijri}</div>
        </React.Fragment>
      );
    };

    // Weather Component
    const WeatherDisplay = () => {
      const cacheKey = 'cachedWeather_kirkuk_v2';
      const [weather, setWeather] = React.useState(() => {
        const cached = localStorage.getItem(cacheKey);
        return cached ? JSON.parse(cached) : null;
      });

      const fetchWeather = React.useCallback(async () => {
        try {
          if (!navigator.onLine && weather) return;

          // Kirkuk, Iraq (Latitude: 35.4681, Longitude: 44.3922)
          const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=35.4681&longitude=44.3922&current=temperature_2m,weather_code&timezone=Asia%2FBaghdad"
          );
          if (!res.ok) throw new Error('Weather fetch failed');
          const data = await res.json();
          setWeather(data.current);
          localStorage.setItem(cacheKey, JSON.stringify(data.current));
        } catch (error) {
          console.warn("Using offline weather data:", error);
        }
      }, [weather]);

      React.useEffect(() => {
        fetchWeather();
        const timer = setInterval(fetchWeather, 1800000); // 30 mins
        window.addEventListener('online', fetchWeather);
        return () => {
          clearInterval(timer);
          window.removeEventListener('online', fetchWeather);
        };
      }, [fetchWeather]);

      // WMO Weather interpretation codes (simplified)
      const getWeatherStyle = (code) => {
        let className = "wi wi-day-sunny";
        let color = "#FFD700"; // Default Yellow Sun
        
        if (code === 0) { className = "wi wi-day-sunny"; color = "#FFD700"; }
        else if (code <= 3) { className = "wi wi-day-cloudy"; color = "#87CEEB"; } // Blue Cloud
        else if (code <= 48) { className = "wi wi-fog"; color = "#D3D3D3"; }
        else if (code <= 67) { className = "wi wi-rain"; color = "#4682B4"; }
        else if (code <= 77) { className = "wi wi-snow"; color = "#FFFFFF"; }
        else if (code <= 82) { className = "wi wi-showers"; color = "#1E90FF"; }
        else if (code <= 99) { className = "wi wi-thunderstorm"; color = "#8A2BE2"; }

        return { className, color };
      };

      const wStyle = getWeatherStyle(weather ? weather.weather_code : 0);
      const tempVal = weather ? Math.round(weather.temperature_2m) : 24;

      return (
        <div className="weather-area">
          <span style={{ color: '#00ddff', fontFamily: 'Lemonada, cursive', fontSize: 'clamp(1.1rem, 1.6vw, 2rem)', fontWeight: '700' }}></span>
          <i className={`weather-icon ${wStyle.className}`} style={{ color: wStyle.color }}></i>
          <div className="weather-temp">{tempVal}°</div>
        </div>
      );
    };

    // from components/EditTimesModal.tsx
    const EditTimesModal = ({ isOpen, onClose, initialTimes, onSave, todayKey, hijriAdjustment, onSaveAdjustment, isRotated, onToggleRotation }) => {
      const [editedTimes, setEditedTimes] = React.useState(initialTimes);
      const [editedAdjustment, setEditedAdjustment] = React.useState(hijriAdjustment);

      React.useEffect(() => {
        if (isOpen) {
          setEditedTimes(initialTimes);
          setEditedAdjustment(hijriAdjustment);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleInputChange = (prayerName, value) => {
        setEditedTimes(prev => ({ ...prev, [prayerName]: value }));
      };

      const handleSave = () => {
        onSave(editedTimes);
        onSaveAdjustment(editedAdjustment);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex justify-center items-center z-[1000] text-base" onClick={onClose}>
          <div className="bg-white p-10 rounded-2xl border-4 border-[#2C2C2C] text-[#2C2C2C] w-[min(90vw,400px)] text-center max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <header className="text-2xl font-bold mb-8">الإعدادات</header>

            <div className="mb-8">
              <h3 className="text-xl font-bold mb-4 border-b pb-2">أوقات الصلاة</h3>
              <div className="space-y-4">
                {prayerOrder.map(name => (
                  <div key={name} className="flex justify-between items-center">
                    <label htmlFor={`time-${name}`} className="text-lg font-semibold">{prayerNamesArabic[name]}</label>
                    <input
                      type="time"
                      id={`time-${name}`}
                      value={editedTimes[name]}
                      onChange={(e) => handleInputChange(name, e.target.value)}
                      className="font-['Changa'] text-lg p-3 border-2 border-gray-300 rounded-xl"
                    />
                  </div>
                ))}
              </div>
            </div>

            <div className="mb-8 border-t pt-6">
              <h3 className="text-xl font-bold mb-4">تعديل التاريخ الهجري</h3>
              <p className="text-gray-600 mb-4 text-sm">يمكنك زيادة أو نقصان أيام من التاريخ الهجري</p>
              <div className="flex justify-center items-center gap-6">
                <button
                  onClick={() => setEditedAdjustment(prev => prev - 1)}
                  className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-full text-2xl font-bold transition-colors"
                >
                  -
                </button>
                <div className="flex flex-col">
                  <span className="text-3xl font-bold text-[#3A5A40]">
                    {editedAdjustment > 0 ? `+${editedAdjustment}` : editedAdjustment}
                  </span>
                  <span className="text-xs text-gray-500">يوم</span>
                </div>
                <button
                  onClick={() => setEditedAdjustment(prev => prev + 1)}
                  className="w-12 h-12 bg-gray-100 hover:bg-gray-200 rounded-full text-2xl font-bold transition-colors"
                >
                  +
                </button>
              </div>
            </div>

            <div className="mb-8 border-t pt-6">
              <h3 className="text-xl font-bold mb-4">اتجاه الشاشة</h3>
              <button
                onClick={onToggleRotation}
                className="w-full bg-blue-600 text-white p-4 rounded-xl text-lg font-bold hover:bg-blue-700 transition-colors"
              >
                {isRotated ? "إلغاء قلب الشاشة (90 درجة)" : "قلب الشاشة (90 درجة)"}
              </button>
            </div>

            <div className="mt-8 flex justify-center gap-4">
              <button onClick={handleSave} className="flex-1 py-4 font-['Changa'] text-lg rounded-2xl cursor-pointer border-none bg-[#3A5A40] text-white font-bold hover:bg-[#2F4934] transition-colors">حفظ التغييرات</button>
              <button onClick={onClose} className="flex-1 py-4 font-['Changa'] text-lg rounded-2xl cursor-pointer border-none bg-gray-200 text-gray-800 font-bold hover:bg-gray-300 transition-colors">إلغاء</button>
            </div>
          </div>
        </div>
      );
    };

    // from App.tsx
    const App = () => {
      const [time, setTime] = React.useState(new Date());
      const [bgIndex, setBgIndex] = React.useState(() => parseInt(localStorage.getItem('selectedBgIndex') || '0', 10));

      React.useEffect(() => {
        const root = document.documentElement;
        const colorPalettes = [
          { start: '#0f2027', mid: '#203a43', end: '#2c5364' }, // Slate Dark
          { start: '#0B0C10', mid: '#1F2833', end: '#121212' }, // Obsidian
          { start: '#062C1B', mid: '#0B4F2C', end: '#021B0E' }, // Dark Emerald
          { start: '#09152B', mid: '#122543', end: '#1C315E' }, // Sapphire Night
          { start: '#1A0B2E', mid: '#2B1055', end: '#16002C' }, // Royal Purple
          { start: '#2A080C', mid: '#4A0E17', end: '#1B0306' }, // Dark Ruby
          { start: '#051A2E', mid: '#0A2E4D', end: '#020C17' }, // Deep Abyss
          { start: '#1C100B', mid: '#2D1B13', end: '#0F0906' }, // Dark Espresso
          { start: '#111827', mid: '#1F2937', end: '#0D1B2A' }, // Charcoal Petrol
          { start: '#13001E', mid: '#2A0040', end: '#0A0012' }, // Dark Violet
          { start: '#24140E', mid: '#3D2016', end: '#140A07' }, // Dark Copper
          { start: '#000000', mid: '#0D0D0D', end: '#1A1A1A' }  // OLED Black
        ];
        const current = colorPalettes[bgIndex % colorPalettes.length];
        root.style.setProperty('--bg-gradient-start', current.start);
        root.style.setProperty('--bg-gradient-mid', current.mid);
        root.style.setProperty('--bg-gradient-end', current.end);
        localStorage.setItem('selectedBgIndex', bgIndex.toString());
      }, [bgIndex]);

      const handleBgChange = () => setBgIndex(prev => prev + 1);
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [hijriAdjustment, setHijriAdjustment] = React.useState(() => {
        return parseInt(localStorage.getItem('hijriAdjustment') || '0', 10);
      });

      const [hijriInfo, setHijriInfo] = React.useState(() => {
        const cached = localStorage.getItem('cachedHijri');
        if (cached) return JSON.parse(cached);
        const today = new Date();
        const adj = parseInt(localStorage.getItem('hijriAdjustment') || '0', 10);
        const adjustedDate = new Date(today);
        adjustedDate.setDate(adjustedDate.getDate() + adj);
        const formatted = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { day: 'numeric', month: 'long' }).format(adjustedDate);
        return { formatted, day: adjustedDate.getDate(), bidRemaining: null };
      });

      const [isRotated, setIsRotated] = React.useState(() => {
        return localStorage.getItem('isRotated') !== 'false';
      });

      const handleToggleRotation = () => {
        setIsRotated(prev => {
          const next = !prev;
          localStorage.setItem('isRotated', next.toString());
          return next;
        });
      };

      const fetchHijri = React.useCallback(async () => {
        try {
          if (!navigator.onLine && hijriInfo.day) return;
          const adjustedDate = new Date();
          adjustedDate.setDate(adjustedDate.getDate() + hijriAdjustment);
          const dateStr = adjustedDate.toLocaleDateString('en-GB').replace(/\//g, '-');
          const res = await fetch("https://api.aladhan.com/v1/gToH?date=" + dateStr);
          const data = await res.json();
          if (data.code === 200) {
            const h = data.data.hijri;
            const currentDay = parseInt(h.day, 10);
            const daysInMonth = parseInt(h.month.days, 10);

            // Calculate Bid Days Counter (Days until 13th)
            // If day 13, 14, 15: we are IN them.
            // Let's show "Now" or just 0? User said "number only". 
            // I'll show 1, 2, 3 for the sequence or just days until start.
            let bidRem = null;
            if (currentDay < 13) {
              bidRem = 13 - currentDay;
            } else if (currentDay >= 13 && currentDay <= 15) {
              bidRem = 0; // Currently in Bid days
            } else {
              // After the 15th, count until next month's 13th
              bidRem = (daysInMonth - currentDay) + 13;
            }

            const info = {
              formatted: `${h.day} ${h.month.ar}`, // Removed year/هـ as requested
              day: currentDay,
              bidRemaining: bidRem
            };
            setHijriInfo(info);
            localStorage.setItem('cachedHijri', JSON.stringify(info));
          }
        } catch (e) {
          console.warn("Hijri API failed");
        }
      }, [hijriInfo.day, hijriAdjustment]);

      const handleSaveAdjustment = React.useCallback((newAdjustment) => {
        setHijriAdjustment(newAdjustment);
        localStorage.setItem('hijriAdjustment', newAdjustment.toString());
        localStorage.removeItem('cachedHijri');
      }, []);

      const {
        prayerTimes,
        loading: prayerLoading,
        error,
        countdownParts,
        handleSavePrayerTimes,
        todayKey,
      } = usePrayerTimes(time);

      React.useEffect(() => {
        const timerId = setInterval(() => setTime(new Date()), 1000);
        fetchHijri();
        window.addEventListener('online', fetchHijri);
        return () => {
          clearInterval(timerId);
          window.removeEventListener('online', fetchHijri);
        };
      }, [fetchHijri]);

      const dateInfo = React.useMemo(() => {
        const today = time;
        const parts = (hijriInfo.formatted || '').split(' ');
        const hijriDay = parts[0] || '';
        const hijriMonth = parts.slice(1).join(' ') || '';

        return {
          weekday: new Intl.DateTimeFormat('ar-EG', { weekday: 'long' }).format(today),
          hijriDay,
          hijriMonth,
          hijri: hijriInfo.formatted,
          gregorian: `${today.getDate()} / ${today.getMonth() + 1}`,
        };
      }, [time, hijriInfo]);

      // Identify next prayer
      const nextPrayerInfo = React.useMemo(() => {
        if (!prayerTimes) return null;
        const now = time;
        const times = prayerOrderForList.map(name => {
          const t = prayerTimes[name];
          if (!t) return null;
          const [h, m] = t.split(':').map(Number);
          const d = new Date(now);
          d.setHours(h, m, 0, 0);
          return { name, date: d };
        }).filter(x => x);

        // Find first prayer that is after now
        const next = times.find(p => p.date > now);

        if (next) return next;

        // If none found, return Fajr (conceptually tomorrow, but for clock display today's Fajr time is fine)
        const fajr = times.find(p => p.name === 'Fajr');
        return fajr;
      }, [time, prayerTimes]);

      const nextPrayerName = nextPrayerInfo ? nextPrayerInfo.name : null;

      if (!prayerTimes && prayerLoading) return <div id="app-loading">جاري التحميل...</div>;
      if (!prayerTimes && error) return <div className="text-white text-center">خطأ: {error}</div>;

      return (
        <div className={`app-container ${isRotated ? 'rotated-90' : ''}`}>
          <main className="main-panel">
            {/* الشريط العلوي الأفقي: التاريخ الميلادي على اليمين | التاريخ الهجري على اليسار */}
            <div className="top-banner-row">
              {/* 1. التاريخ الميلادي (على اليمين في RTL) */}
              <div className="top-info-card gregorian-date-card">
                <span className="date-weekday-text">{dateInfo.weekday}</span>
                <span className="date-gregorian-text">{dateInfo.gregorian}</span>
              </div>

              {/* 2. التاريخ الهجري (على اليسار في RTL) */}
              <div className="top-info-card hijri-date-card">
                <div className="hijri-date-box">
                  <span className="hijri-day-text">{dateInfo.hijriDay}</span>
                  <span className="hijri-month-text">{dateInfo.hijriMonth}</span>
                </div>
              </div>
            </div>

            {/* القسم السفلي: شبكة 3 أعمدة (صلوات يمين | عداد وسط | صلوات يسار) */}
            <div className="bottom-dashboard-grid">
              {/* الجهة اليمنى: 3 صلوات (الفجر، الشروق، الظهر) */}
              <div className="side-prayers-panel">
                {prayerTimes && ['Fajr', 'Sunrise', 'Dhuhr'].map(name => {
                  const isNext = nextPrayerName === name;
                  return (
                    <div key={name} className={`prayer-card ${isNext ? 'next-prayer' : ''}`}>
                      <span className="prayer-card-name">{prayerNamesArabic[name]}</span>
                      <span className="prayer-card-time">
                        {formatTo12Hour(prayerTimes[name])}
                      </span>
                    </div>
                  );
                })}
              </div>

              {/* الوسط: عداد الصلاة القادمة والطقس بداخله */}
              <div className="center-countdown-panel">
                <div className="next-prayer-countdown-card">
                  {/* الطقس داخل بطاقة الصلاة القادمة */}
                  <div className="weather-badge-inside">
                    <WeatherDisplay />
                  </div>

                  <div className="next-prayer-label">
                    باقي لصلاة {nextPrayerName ? prayerNamesArabic[nextPrayerName] : ''}
                  </div>
                  <div className="countdown-wrapper">
                    <Countdown countdownParts={countdownParts} large={true} />
                  </div>
                </div>
              </div>

              {/* الجهة اليسرى: 3 صلوات (العصر، المغرب، العشاء) */}
              <div className="side-prayers-panel">
                {prayerTimes && ['Asr', 'Maghrib', 'Isha'].map(name => {
                  const isNext = nextPrayerName === name;
                  return (
                    <div key={name} className={`prayer-card ${isNext ? 'next-prayer' : ''}`}>
                      <span className="prayer-card-name">{prayerNamesArabic[name]}</span>
                      <span className="prayer-card-time">
                        {formatTo12Hour(prayerTimes[name])}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            {hijriInfo.bidRemaining !== null && (
              <div className="bid-counter-circle" onClick={handleBgChange} style={{ cursor: 'pointer', zIndex: 100 }} title="تغيير لون الخلفية">
                <span className="bid-counter-value">{hijriInfo.bidRemaining}</span>
                <span className="bid-counter-label">البيض</span>
              </div>
            )}

            <button
              className="settings-button"
              onClick={() => setIsModalOpen(true)}
              aria-label="Settings"
            >
              <SettingsIcon />
            </button>

            {prayerTimes && (
              <EditTimesModal
                isOpen={isModalOpen}
                onClose={() => setIsModalOpen(false)}
                initialTimes={prayerTimes}
                onSave={handleSavePrayerTimes}
                todayKey={todayKey}
                hijriAdjustment={hijriAdjustment}
                onSaveAdjustment={handleSaveAdjustment}
                isRotated={isRotated}
                onToggleRotation={handleToggleRotation}
              />
            )}
          </main>
        </div>
      );
    };

    // from index.tsx
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sira/sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
