<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أوقات الصلاة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.cdnfonts.com/css/dseg" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Changa:wght@600;700&family=El+Messiri:wght@400..700&family=Orbitron:wght@700;900&family=VT323&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">
  <link rel="shortcut icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  <style>
    :root {
      /* Midnight Gold Palette */
      --bg-gradient-start: #0f2027;
      --bg-gradient-mid: #203a43;
      --bg-gradient-end: #2c5364;

      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

      --text-primary: #FFFFFF;
      --text-secondary: #E0E0E0;
      --text-accent: #F7B42C;
      /* Gold */
      --text-dim: rgba(255, 255, 255, 0.6);

      /* Clock Colors (White Theme) */
      --clock-face-bg: #FFFFFF;
      --clock-text-color: #1a1a1a;
      --clock-hand-hour: #1a1a1a;
      --clock-hand-minute: #1a1a1a;
      --clock-hand-second: #F7B42C;
      /* Keep accent for second hand? or make red/black? keeping accent for now */
      --clock-center-dot: #F7B42C;
      --hour-marker-color: #1a1a1a;
      --minute-marker-color: rgba(0, 0, 0, 0.454);

      --font-primary: 'Changa', sans-serif;
      --font-secondary: 'Almarai', sans-serif;
      --font-display: 'El Messiri', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-secondary);
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      padding: 1rem;
      display: flex;
      transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
    }
    
    .app-container.rotated-90 {
      transform: rotate(90deg);
      width: 100vh;
      height: 100vw;
    }

    .main-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.6rem;
      position: relative;
    }

    /* Top Section: Header & Clock */
    .top-section {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      position: relative;
      padding-top: 0;
      width: 100%;
      height: 100%;
    }

    /* Container for the Main Clock to keep it square and centered */
    .top-section .clock-wrapper {
      width: 100%;
      flex: 1.5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    .top-section .clock-wrapper .prayer-card {
      width: 100%;
      height: 100%;
    }

    /* Consolidated Info Card (Bottom) */
    .top-section .info-wrapper {
      flex: 1.2;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0;
    }

    .top-section .info-wrapper .top-card {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 1rem;
    }

    /* Make the countdown (which will be the 3rd child now) span both columns? 
       No, the user requested squares.
       However, we are removing the 3rd card. So we have 3 cards.
       1: Clock, 2: Info, 3: Countdown.
       If we want squares, maybe 3 squares in a row? No, screens are vertical.
       User approved "Digital Countdown span the full width".
       If it spans full width, it will be a rectangle.
       Let's proceed with making it span full width.
    */
    .top-section> :nth-child(3) {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      /* Allow rectangle for countdown */
      height: 80%;
      /* Fill the row height */
    }

    /* Cards in Top Section */
    .top-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 6rem;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 1rem;
      /* Force Square */
      width: 80%;
    }

    /* Quadrant 1: Main Clock (Top Right usually in RTL, but grid items order is 1,2,3,4) */
    /* We will place them in order: MainClock, Info, NextClock, Countdown */

    .clock-container {
      width: 100%;
      height: 100%;
      /* Removed max-width to allow full fill if needed, or keep it to ensure roundness? 
         If user wants full card background white, we should apply background to card or make clock fill card.
         User said "background of the clock... full size of the card". 
      */
      max-width: none;
      aspect-ratio: auto;
      /* Let it stretch */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ghost Hands Style */
    .hand.ghost {
      opacity: 0.3;
      /* Faint */
      z-index: 5;
      /* Behind main hands */
      background-color: #555 !important;
      /* Force grey */
      /* Make them slightly thinner/shorter to distinguish? */
    }

    .hand.ghost-hour {
      width: 1rem;
      height: 25%;
    }

    .hand.ghost-minute {
      width: 0.6rem;
      height: 38%;
    }

    /* Quadrant 2: Info (Date + Weather) */
    .info-card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      height: 100%;
      width: 50%;
      text-align: center;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
    }

    /* Quadrant 4: Digital Countdown */
    .digital-countdown-large {
      display: flex;
      flex-direction: row;
      align-items: center;
      /* Center Vertically */
      justify-content: center;
      gap: 0.5rem;
      direction: ltr;
      /* Force LTR for numbers 12:45 */
      width: 100%;
      height: 100%;
      /* Fill height */
    }

    .digital-countdown-large .curr-time {
      font-size: 12rem;
      font-weight: 700;
      color: var(--text-accent);
      font-family: 'Changa';
      line-height: 0.9;
      letter-spacing: 0px;
    }

    .consolidated-info-row {
      display: flex;
      flex-direction: row-reverse;
      /* Arabic RTL logic for visual balance? Or standard row? standard row. */
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-top: 1rem;
      border-top: 1px solid var(--glass-border);
      padding-top: 1rem;
    }

    .digital-countdown-large .labels-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 1rem;
    }


    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--clock-face-bg);
      border-radius: inherit;
      /* Inherit from card if direct child, or keep its own? Card has 2rem */
      /* We will set the Card to have the white bg for the main clock, and this to transparent? */
      /* Or make this fill completely. Let's make this fill completely. */
      /* If padding is 0, this needs to match card radius */
      border-radius: 20rem;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
      border: none;
      /* Border is on the card? Or keep border here? Use border on card. */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Modifiers for specific cards */
    .top-card.clock-card-full {
      padding: 0;
      background: var(--clock-face-bg);
      /* The card itself is white */
      border: 4px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .top-card.clock-card-full .clock-face {
      background: transparent;
      /* Card handles bg */
      box-shadow: none;
      /* Card handles shadow */
      width: 100%;
      height: 100%;
    }

    /* Keep internal clock elements mostly same but updated colors */
    .clock-face .number {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--clock-text-color);
      font-family: 'Changa';
      z-index: 5;
      line-height: 1;
      text-shadow: none;
    }

    .number-12 {
      top: 13%;
      left: 50%;
    }

    .number-3 {
      top: 50%;
      left: 87%;
    }

    .number-6 {
      top: 87%;
      left: 50%;
    }

    .number-9 {
      top: 50%;
      left: 13%;
    }

    .marker-container {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .marker {
      position: absolute;
      left: 50%;
      top: 3%;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .minute-marker {
      width: 2px;
      height: 6%;
      background-color: var(--minute-marker-color);
    }

    .hour-marker {
      width: 4px;
      height: 12%;
      background-color: var(--hour-marker-color);
      box-shadow: 0 0 5px rgba(247, 180, 44, 0.5);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      border-radius: 50px;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .hour-hand {
      width: 1.2rem;
      height: 28%;
      background-color: var(--clock-hand-hour);
    }

    .minute-hand {
      width: 1rem;
      height: 38%;
      background-color: var(--clock-hand-minute);
    }

    .second-hand {
      width: 0.4rem;
      height: 45%;
      background-color: var(--clock-hand-second);
      z-index: 12;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--clock-center-dot);
      border-radius: 50%;
      border: 3px solid var(--clock-hand-hour);
      z-index: 13;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Date & Weather Styling (Side Info) */
    .info-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 1.5rem;
      border-radius: 1.5rem;
      backdrop-filter: blur(5px);
      min-width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .date-weekday {
      position: absolute;

      font-size: 6rem;
      /* Reduced from 8.5rem to fit card */
      font-weight: 700;
      color: var(--text-accent);
      font-family: var(--font-display);
      line-height: -0.7;
      margin-bottom: -0.5rem;
      margin-top: 0;
      top: 50%;
      text-align: center;
    }

    .date-gregorian {
      position: absolute;
      top: 40%;
      font-size: 5rem;
      /* Reduced to fit */
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 0.7;
      margin-top: 0;
    }

    .date-hijri {
      position: absolute;
      top: 15%;
      font-size: 4rem;
      /* Reduced to fit */
      font-weight: 600;
      color: var(--text-primary);
      font-family: var(--font-display);
      line-height: 0.7;
      margin-top: 0.1rem;
    }

    .weather-area {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .weather-icon {
      font-size: 5rem;
      color: var(--text-accent);
      line-height: 1;
    }

    .weather-temp {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    /* Countdown */
    .countdown-container {
      margin-top: 2rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem 2rem;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
    }

    .digital-countdown {
      flex-direction: row;
      /* Horizontal now */
      gap: 1.5rem;
      direction: ltr;
      text-align: center;
    }

    .time-part {
      align-items: center;
      color: var(--text-primary);
    }

    .time-part .value {
      font-size: 4rem;
      font-weight: 700;
      font-family: 'Changa';
      color: var(--text-accent);
      line-height: 1;
      min-width: 2ch;
    }

    .time-part .label {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Bottom Section: Prayers */
    .bottom-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .prayer-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.6rem;
      width: 100%;
      height: 100%;
      position: static;
    }

    .prayer-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
      /* Reduced from 1.5rem */
      max-width: none;
      /* Reset */
      flex-basis: auto;
      /* Reset */
      flex-grow: 1;
      transition: transform 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }

    .prayer-card.next-prayer {
      background: rgba(247, 180, 44, 0.15);
      border-color: var(--text-accent);
      transform: scale(1.02);
    }

    .prayer-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.08);
    }

    .prayer-card-name {
      font-size: 2.5rem;
      /* Larger */
      font-weight: 600;
      font-family: var(--font-display);
      color: #ffd000;
      margin-bottom: -0.5rem;
      /* Tight margin */
      line-height: 1.7;
    }

    .prayer-card-time {
      font-size: 5.5rem;
      /* Larger */
      font-weight: 800;
      font-family: var(--font-primary);
      color: var(--text-primary);
      direction: ltr;
      line-height: 0.7;
    }

    .prayer-card.next-prayer .prayer-card-name {
      color: var(--text-accent);
    }

    .prayer-card.next-prayer .prayer-card-time {
      color: var(--text-accent);
      text-shadow: 0 0 15px rgba(247, 180, 44, 0.4);
    }

    /* Settings Button */
    .settings-button {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-dim);
      border: 1px solid var(--glass-border);
      width: 3.5rem;
      height: 3.5rem;
    }

    .settings-button:hover {
      background: var(--text-accent);
      color: #000;
      border-color: var(--text-accent);
    }

    /* 3D Prominent Clock Card */
    .clock-card-3d {
      background: var(--clock-face-bg) !important;
      border: 12px solid #1a1a1a !important;
      box-shadow:
        0 12px 0 #000,
        0 20px 40px rgba(0, 0, 0, 0.7),
        inset 0 0 20px rgba(0, 0, 0, 0.1) !important;
      transform: translateY(-8px);
      z-index: 10;
    }

    .bid-counter-circle {
      position: absolute;
      top: 34rem;
      right: 0.1rem;
      width: 5rem;
      height: 5rem;
      background: var(--clock-face-bg);
      border: 8px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #1a1a1a;
      box-shadow:
        0 2px 0 #000,
        0 10px 10px rgba(0, 0, 0, 0.4),
        inset 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 20;
    }

    .bid-counter-value {
      font-weight: 800;
      font-size: 2rem;
      line-height: 1;
      font-family: var(--font-primary);
    }

    .bid-counter-label {
      font-size: 0.6rem;
      color: #999;
      font-weight: 700;
      margin-top: -2px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

</head>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div id="offline-loader" style="color: white; font-family: sans-serif; text-align: center; padding-top: 20vh;">
      <h2 id="loading-text">جاري التحميل...</h2>
      <p id="connectivity-status" style="opacity: 0.6; margin-top: 1rem;"></p>
      <script>
        const loadingText = document.getElementById('loading-text');
        const statusText = document.getElementById('connectivity-status');

        // Only show error if React fails to load after 8 seconds
        setTimeout(() => {
          if (!window.React) {
            loadingText.innerText = "تعذر تحميل ملفات التشغيل";
            statusText.innerText = "يرجى التحقق من الاتصال بالإنترنت.";
          }
        }, 8000);

        // Don't reload the whole page when online, React components handle their own data retry
        if (!navigator.onLine) {
          statusText.innerText = "أنت غير متصل بالإنترنت. سيتم عرض البيانات المخزنة مسبقاً.";
        }
      </script>
    </div>
  </div>
  <script>
    // --- SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'prayer-times-v1';
          const ASSETS = [
            '${window.location.href}',
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.development.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
            'https://unpkg.com/babel-standalone@6/babel.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
            );
          });

          self.addEventListener('fetch', (event) => {
            event.respondWith(
              caches.match(event.request).then((response) => {
                return response || fetch(event.request);
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).catch(err => console.log('SW failed', err));
      });
    }
  </script>
  <script type="text/babel">
    // --- START OF COMBINED CODE ---

    // from constants.ts
    const prayerNamesArabic = {
      Fajr: 'الفجر',
      Sunrise: 'الشروق',
      Dhuhr: 'الظهر',
      Asr: 'العصر',
      Maghrib: 'المغرب',
      Isha: 'العشاء',
    };
    const prayerOrder = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const prayerOrderForList = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

    // from utils/time.ts
    const getTodaysDateKey = (date = new Date()) => {
      const month = (date.getMonth() + 1).toString().padStart(2, '0');
      const day = date.getDate().toString().padStart(2, '0');
      return `${month}-${day}`;
    };
    const formatTo12Hour = (timeString) => {
      if (!timeString || !timeString.includes(':')) return timeString;
      const [hour, minute] = timeString.split(':');
      let h = parseInt(hour, 10);
      h = h % 12;
      h = h ? h : 12; // The hour '0' should be '12'
      const hourStr = String(h).padStart(1, '0');
      return `${hourStr}:${minute}`;
    };

    // Helper to calculate time differences
    const addMinutesToTimeStr = (timeStr, minutes) => {
      if (!timeStr || !timeStr.includes(':')) return timeStr;
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      d.setMinutes(d.getMinutes() + minutes);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };

    const getPrayerOffsets = () => {
      try {
        return JSON.parse(localStorage.getItem('prayerOffsets') || '{}');
      } catch {
        return {};
      }
    };

    const applyOffsets = (timings) => {
      if (!timings) return timings;
      const offsets = getPrayerOffsets();
      const adjusted = { ...timings };
      Object.keys(offsets).forEach(prayer => {
        if (adjusted[prayer]) {
          adjusted[prayer] = addMinutesToTimeStr(adjusted[prayer], offsets[prayer]);
        }
      });
      return adjusted;
    };

    const DEFAULT_PRAYER_TIMES = {
      Fajr: "03:37",
      Sunrise: "05:16",
      Dhuhr: "12:08",
      Asr: "15:54",
      Maghrib: "19:00",
      Isha: "20:30"
    };

    // from hooks/usePrayerTimes.ts
    const usePrayerTimes = (currentTime) => {
      const todayKey = React.useMemo(() => getTodaysDateKey(currentTime), [currentTime]);
      
      const [basePrayerTimes, setBasePrayerTimes] = React.useState(() => {
        const cached = localStorage.getItem(`cachedPrayerTimes_${todayKey}`);
        return cached ? JSON.parse(cached) : DEFAULT_PRAYER_TIMES;
      });

      const [prayerTimes, setPrayerTimes] = React.useState(() => applyOffsets(basePrayerTimes));
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      const [nextPrayerCountdown, setNextPrayerCountdown] = React.useState(0);
      const [countdownMode, setCountdownMode] = React.useState('normal');

      const fetchPrayerTimes = React.useCallback(async () => {
        const cacheKey = `cachedPrayerTimes_${todayKey}`;
        try {
          if (!navigator.onLine) {
            setLoading(false);
            return;
          }

          const response = await fetch(`https://api.aladhan.com/v1/timings?latitude=35.4687&longitude=44.3922&method=4`);
          if (!response.ok) throw new Error('Network error');

          const data = await response.json();
          if (data.code === 200 && data.data && data.data.timings) {
            setBasePrayerTimes(data.data.timings);
            setPrayerTimes(applyOffsets(data.data.timings));
            localStorage.setItem(cacheKey, JSON.stringify(data.data.timings));
            setError(null);
          }
        } catch (err) {
          console.warn("Prayer times fetch failed:", err);
        } finally {
          setLoading(false);
        }
      }, [todayKey]);

      React.useEffect(() => {
        fetchPrayerTimes();
        window.addEventListener('online', fetchPrayerTimes);
        return () => window.removeEventListener('online', fetchPrayerTimes);
      }, [fetchPrayerTimes]);

      // Calculate Next Prayer and Countdown
      React.useEffect(() => {
        if (!prayerTimes) return;

        const now = currentTime || new Date();

        const prayerDates = prayerOrder.map(name => {
          const timeStr = prayerTimes[name];
          if (!timeStr) return null;
          
          const parts = timeStr.split(':');
          if (parts.length >= 2) {
              const h = parseInt(parts[0], 10);
              const m = parseInt(parts[1], 10);
              const date = new Date(now);
              date.setHours(h, m, 0, 0);
              return { name, date };
          }
          return null;
        }).filter(p => p !== null);

        let elapsedPrayer = null;
        for (const prayer of prayerDates) {
            const diff = now.getTime() - prayer.date.getTime();
            if (diff >= 0 && diff <= 20 * 60 * 1000) {
                elapsedPrayer = diff;
                break;
            }
        }

        if (elapsedPrayer !== null) {
            setCountdownMode('elapsed');
            setNextPrayerCountdown(elapsedPrayer);
            return;
        }

        let nextPrayerTime = null;
        for (const prayer of prayerDates) {
          if (prayer.date > now) {
            nextPrayerTime = prayer.date;
            break;
          }
        }

        if (!nextPrayerTime && prayerDates.length > 0) {
          nextPrayerTime = new Date(prayerDates[0].date);
          nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        }

        if (nextPrayerTime) {
          const diff = nextPrayerTime.getTime() - now.getTime();
          setNextPrayerCountdown(diff);
          setCountdownMode(diff <= 5 * 60 * 1000 ? 'imminent' : 'normal');
        }

      }, [currentTime, prayerTimes]);

      const handleSavePrayerTimes = React.useCallback((newTimes) => {
        // Calculate new offsets based on the base API times
        if (!basePrayerTimes) return; // Prevent saving if no base internet times
        
        const offsets = getPrayerOffsets();
        
        Object.keys(newTimes).forEach(prayer => {
          const base = basePrayerTimes[prayer];
          const updated = newTimes[prayer];
          if (base && updated) {
            const [h1, m1] = base.split(':').map(Number);
            const [h2, m2] = updated.split(':').map(Number);
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff !== 0) {
              offsets[prayer] = diff;
            } else {
              delete offsets[prayer];
            }
          }
        });
        
        localStorage.setItem('prayerOffsets', JSON.stringify(offsets));
        setPrayerTimes(applyOffsets(basePrayerTimes));
      }, [basePrayerTimes]);

      const countdownParts = React.useMemo(() => {
        const totalSeconds = Math.max(0, Math.floor(nextPrayerCountdown / 1000));
        const hrs = Math.floor(totalSeconds / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        return {
            hours: String(hrs),
            minutes: String(mins).padStart(2, '0'),
            seconds: String(secs).padStart(2, '0'),
            totalSeconds,
            mode: countdownMode
        };
      }, [nextPrayerCountdown, countdownMode]);

      return {
        prayerTimes,
        loading,
        error,
        countdownParts,
        handleSavePrayerTimes,
        todayKey
      };
    };

      const getWeatherStyle = (code) => {
        let className = "wi wi-day-sunny";
        let color = "#FFD700"; // Default Yellow Sun
        
        if (code === 0) { className = "wi wi-day-sunny"; color = "#FFD700"; }
        else if (code <= 3) { className = "wi wi-day-cloudy"; color = "#87CEEB"; } // Blue Cloud
        else if (code <= 48) { className = "wi wi-fog"; color = "#D3D3D3"; }
        else if (code <= 67) { className = "wi wi-rain"; color = "#4682B4"; }
        else if (code <= 77) { className = "wi wi-snow"; color = "#FFFFFF"; }
        else if (code <= 82) { className = "wi wi-showers"; color = "#1E90FF"; }
        else if (code <= 99) { className = "wi wi-thunderstorm"; color = "#8A2BE2"; }

        return { className, color };

        <div className={`app-container ${isRotated ? 'rotated-90' : ''}`}>
          <main className="main-panel">
            {/* Top Section: Vertical Flex */}
            <div className="top-section">

              {/* Top: Main Clock (Classic Casio Digital Watch Style) */}
              <div className="clock-wrapper" style={{ flex: '1', width: '100%' }}>
                <div className="top-card" style={{
                  width: '100%',
                  height: '100%',
                  borderRadius: '16px',
                  padding: '1rem',
                  display: 'flex',
                  flexDirection: 'column',
                  justifyContent: 'center',
                  alignItems: 'center',
                  background: 'linear-gradient(180deg, #7c8b7b 0%, #6d7b6c 100%)',
                  border: '3px solid #4a544a',
                  boxShadow: 'inset 0 3px 8px rgba(0,0,0,0.4), 0 4px 15px rgba(0,0,0,0.3)'
                }}>
                  <DigitalClock
                    time={time}
                    dateInfo={dateInfo}
                    showSeconds={true}
                  />
                </div>
              </div>

              {/* Bottom: Consolidated Info (3 Cards Row + Countdown) */}
              <div className="info-wrapper" style={{ gap: '0.6rem', flexDirection: 'column', display: 'flex', flex: '1.4', width: '100%' }}>
                
                {/* 3 Cards Row under Main Clock */}
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.6rem', width: '100%', direction: 'rtl', flex: '1' }}>
                  
                  {/* Card 1: Weather */}
                  <div className="prayer-card" style={{ padding: '0.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', height: '100%' }}>
                    <WeatherDisplay />
                  </div>

                  {/* Card 2: Gregorian Day & Date (Day/Month) */}
                  <div className="prayer-card" style={{ padding: '0.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', height: '100%', gap: '0.2rem' }}>
                    <div style={{ fontSize: '3.5rem', fontWeight: 'bold', color: 'var(--text-accent)', lineHeight: 1 }}>{dateInfo.weekday}</div>
                    <div style={{ fontSize: '3.5rem', fontWeight: 'bold', color: '#87CEEB', direction: 'ltr', unicodeBidi: 'plaintext', lineHeight: 1 }}>{dateInfo.gregorian}</div>
                  </div>

                  {/* Card 3: Hijri Date (Day Number & Month Name with Different Colors) */}
                  <div className="prayer-card" style={{ padding: '0.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', height: '100%', gap: '0.2rem' }}>
                    <div style={{ fontSize: '3.5rem', fontWeight: 'bold', textAlign: 'center', lineHeight: 1, display: 'flex', gap: '0.5rem', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' }}>
                      <span style={{ color: 'var(--text-accent)' }}>{dateInfo.hijriDay}</span>
                      <span style={{ color: '#87CEEB' }}>{dateInfo.hijriMonth}</span>
                    </div>
                  </div>

                </div>

                {/* Next Prayer Countdown Card */}
                <div className="top-card" style={{ padding: '0.8rem 1.5rem', display: 'flex', flexDirection: 'row', justifyContent: 'center', alignItems: 'center', gap: '1.5rem', height: '100%', borderRadius: '16px', direction: 'rtl', width: '100%', flex: '1' }}>
                  <div style={{ fontSize: '1.8rem', fontWeight: 'bold', color: '#FFFFFF' }}>
                    باقي لصلاة {nextPrayerName ? prayerNamesArabic[nextPrayerName] : ''}
                  </div>
                  <div style={{ direction: 'ltr' }}>
                    <Countdown countdownParts={countdownParts} large={true} />
                  </div>
                </div>
              </div>

            </div>

            {/* Bottom Section */}
            <div className="bottom-section">
              {prayerTimes && (
                <PrayerList
                  prayerTimes={prayerTimes}
                  prayerOrder={prayerOrderForList}
                  nextPrayer={nextPrayerName}
                />
              )}
            </div>

            {hijriInfo.bidRemaining !== null && (
              <div className="bid-counter-circle" onClick={handleBgChange} style={{ cursor: 'pointer', zIndex: 100 }} title="تغيير لون الخلفية">
                <span className="bid-counter-value">{hijriInfo.bidRemaining}</span>
                <span className="bid-counter-label">البيض</span>
              </div>
            )}

            <button
              className="settings-button"
              onClick={() => setIsModalOpen(true)}
              aria-label="Settings"
            >
              <SettingsIcon />
            </button>

            {prayerTimes && (
              <EditTimesModal
                isOpen={isModalOpen}
                onClose={() => setIsModalOpen(false)}
                initialTimes={prayerTimes}
                onSave={handleSavePrayerTimes}
                todayKey={todayKey}
                hijriAdjustment={hijriAdjustment}
                onSaveAdjustment={handleSaveAdjustment}
                isRotated={isRotated}
                onToggleRotation={handleToggleRotation}
              />
            )}
          </main>
        </div>
      );
    };

    // from index.tsx
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <React.StrictMode>
        <App />
      </React.StrictMode>
    );
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sira/sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
