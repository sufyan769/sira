  <style id="active-theme-style"></style>

<body>
<main class="mosque-screen" dir="rtl">
  <div class="soft-pattern" aria-hidden="true"></div>

  <div class="fit-content" id="fit-content">
  <section class="clock-frame" aria-label="الساعة الحالية">
    <time id="live-clock">00:00:00</time>
  </section>

  <section class="date-block" aria-label="التاريخ">
    <strong class="weekday" id="live-weekday">--</strong>
    <div style="display: flex; gap: clamp(10px, 2vw, 25px); width: 100%; justify-content: center; flex-wrap: wrap;">
      <div class="date-card hijri-card">
        <span class="date-label"></span>
        <div class="date-value" id="live-hijri">
          <span class="day-number">--</span>
          <span>--</span>
          <span>--</span>
        </div>
      </div>
      <div class="date-card">
        <span class="date-label"></span>
        <div class="date-value" id="live-gregorian">
          <span class="day-number">--</span>
          <span>--</span>
          <span>--</span>
        </div>
      </div>
    </div>
  </section>

  <section class="prayer-list" id="prayer-list-container" aria-label="أوقات الصلاة"></section>

  <footer class="countdown-footer">
    <div class="countdown-column">
      <span>المتبقي للإقامة</span>
      <strong id="countdown-iqama">00:00:00</strong>
    </div>
    <div class="countdown-column">
      <span>الأذان التالي</span>
      <strong id="countdown-adhan">00:00:00</strong>
    </div>
  </footer>
  </div>

  <div class="settings-layer" id="settings-modal" style="display: none;" role="presentation">
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <div>
          <span>لوحة التحكم</span>
          <h2 id="settings-title">إعدادات المواقيت</h2>
        </div>
        <button class="settings-close" type="button" id="close-settings" aria-label="إغلاق الإعدادات">×</button>
      </header>
      <p class="settings-description">اضبط وقت الأذان ووقت الإقامة لكل صلاة.</p>
      <div class="settings-prayers" id="settings-prayers-container"></div>
      <div class="settings-special">
        <div class="settings-row">
          <div>
            <strong>تصحيح التاريخ الهجري</strong>
            <small>التعديل بالأيام (+ أو −)</small>
          </div>
          <div class="minute-control">
            <button type="button" id="hijri-dec">−</button>
            <input type="number" id="hijri-input" min="-180" max="180" value="0" />
            <button type="button" id="hijri-inc">+</button>
            <em>يوم</em>
          </div>
        </div>
      </div>
      <div class="settings-actions">
        <button class="reset-button" type="button" id="reset-settings">إعادة الضبط</button>
        <button class="save-button" type="button" id="save-settings">حفظ وإغلاق</button>
      </div>
    </section>
  </div>
</main>

 100vh; height: 100vw;\n    margin: 0; padding: var(--container-padding);\n    overflow: hidden;\n    background-color: #f8fbf9;\n    background-image: url('bg.jpg') !important;\n    background-size: cover !important;\n    background-position: center !important;\n    background-repeat: no-repeat !important;\n    transform: rotate(90deg) translateY(-100%);\n    transform-origin: top left;\n}\n    @media (orientation: portrait) { .mosque-screen { width: 100vw; height: 100vh; transform: none; } }\n\n    /* ========================================\n       حاوية التصغير التلقائي (لمنع خروج المحتوى)\n       ======================================== */\n    .fit-content {\n    display: flex;\n    flex-direction: column;\n    flex: 1 1 0;\n    min-height: 0;\n    width: 100%;\n    justify-content: space-between;\n    container-type: size; /* تفعيل Container Queries */\n}\n.prayer-row, .clock-frame, .date-card {\n    background: rgba(255, 255, 255, 0.92) !important;\n    backdrop-filter: blur(4px);\n}\n    /* ========================================\n       الخلفية\n       ======================================== */\n    .soft-pattern {\n       display: none !important;\n}\n\n    /* ========================================\n       زر الإعدادات\n       ======================================== */\n    .settings-button {\n        position: absolute; top: clamp(10px, 2.2vh, 26px); right: clamp(10px, 2.5vw, 28px);\n        z-index: 4; display: grid; place-items: center;\n        width: clamp(34px, 5.5vw, 54px); height: clamp(34px, 5.5vw, 54px);\n        padding: 0; border: 1px solid rgba(30,91,57,.3); border-radius: 50%;\n        color: #185d38; background: rgba(255,255,255,.85);\n        cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);\n        transition: background .2s ease, transform .2s ease;\n    }\n    .settings-button:hover { background: #fff; transform: rotate(30deg); }\n    .settings-button svg { width: 60%; height: 60%; fill: currentColor; }\n\n    /* ========== ght: 700; font-family: var(--font-arabic);\n        margin-bottom: 2px; opacity: 0.8;\n    }\n    .date-card .date-value {\n        color: #0b0d0d; font-size: clamp(18px, 3.5vw, 38px);\n        font-weight: 800; font-family: var(--font-arabic);\n        line-height: 1.3; text-align: center;\n    }\n    .date-card .date-value .day-number {\n        font-family: var(--font-numbers); font-weight: 900;\n    }\n    .date-card.hijri-card { border-color: rgba(138,22,64,0.25); }\n    .date-card.hijri-card .date-label { color: #8a1640; }\n\n    /* ========================================\n       قائمة الصلوات\n       ======================================== */\n    .prayer-list {\n       display: flex;\n    flex-direction: column;\n    flex: 1 1 auto;\n    justify-content: space-between;\n    min-height: 0;\n    width: 100%;\n    max-width: 92%;\n    margin: 0 auto;\n    padding: 8px 0;\n    gap: 8px;\n}\n    .prayer-row {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    flex: 1 1 0;\n    min-height: 0;\n    padding: 0 32px;\n    border: 2px solid var(--border-prayer);\n    border-radius: 20px;\n    background: var(--bg-prayer);\n    overflow: hidden;\n    direction: ltr;\n}\n    .prayer-row.next-prayer {\n        border-color: var(--border-prayer-active);\n        background: var(--bg-prayer-active);\n        box-shadow: 0 4px 16px rgba(24,93,56,0.18);\n    }\n    .prayer-row strong {\n    color: var(--text-prayer-name);\n    direction: rtl;\n    font-family: var(--font-arabic);\n    font-size: clamp(38px, 4.5vw, 68px) !important;\n    font-weight: 700;\n    line-height: 1;\n    white-space: nowrap;\n}\n    .prayer-row.next-prayer strong { color: var(--text-prayer-active); }\n    .prayer-row time {\n    color: var(--text-prayer-time);\n    direction: ltr;\n    font-family: var(--font-numbers);\n    font-size: clamp(48px, 6vw, 92px) !important;\n    font-weight: 800;\n    line-height: 1;\n    letter-spacing: .02em;\n    white-space: nowrap;\n}\n    .prayer-row.next-prayer time { color: var(--text-prayer-active); }\n\n    /* ========================================\n       العد التنازلي\n       ======================================== */\n    .countdown-footer {\n        display: grid;\n    grid-template-columns: 1fr 1fr;\n    flex: 0 0 clamp(85px, 12vh, 145px);\n    width: calc(100% + clamp(32px, 7vw, 84px));\n    margin-right: calc(clamp(16px, 3.5vw, 42px) * -1);\n    margin-left: calc(clamp(16px, 3.5vw, 42px) * -1);\n    padding: clamp(10px, 1.5vh, 18px) clamp(16px, 3.5vw, 42px) 0;\n    color: var(--footer-text);\n    background: var(--footer-bg);\n    direction: ltr;\n    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.15);\n}\n    .countdown-column {\n        display: flex;\n    align-items: center;\n    flex-direction: column;\n    justify-content: center;\n    direction: rtl;\n}\n    .countdown-column span {\n        font-family: var(--font-arabic);\n    font-size: clamp(18px, 2.2vw, 32px) !important;\n    font-weight: 700;\n    line-height: 1.2;\n    opacity: 0.95;\n    white-space: nowrap;\n}\n    .countdown-column strong {\n        margin-top: 4px;\n    direction: ltr;\n    font-family: var(--font-numbers);\n    font-size: clamp(42px, 5.5vw, 82px) !important;\n    font-weight: 800;\n    line-height: 1;\n    letter-spacing: .02em;\n    white-space: nowrap;\n}\n\n    /* ========================================\n       الإعدادات\n       ======================================== */\n    .settings-layer {\n       position: absolute;\n    inset: 0;\n    z-index: 9999;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background: rgba(0, 0, 0, 0.75);\n    backdrop-filter: blur(6px);\n    padding: 16px;\n}\n    .settings-panel {\n       display: flex;\n    flex-direction: column;\n    width: 95%;\n    max-width: 850px;\n    height: 96%;\n    max-height: 96%;\n    padding: 20px 24px;\n    border-radius: 20px;\n    border: 2px solid rgba(21, 91, 56, 0.3);\n    background: #ffffff;\n    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);\n    overflow-y: auto;\n}\n    .settings-header {\n        display: flex; align-items: flex-start; justify-content: space-between;\n        gap: 18px; padding-bottom: 12px;\n        border-bottom: 1px solid rgba(21,91,56,.18);\n    }\n    .settings-header span { display: block; color: #8a1640; font-size: clamp(11px, 2.2vw, 15px); font-weight: 700; font-family: var(--font-arabic); }\n    .settings-header h2 { margin: 1px 0 0; color: #155b38; font-size: clamp(20px, 4vw, 32px); font-weight: 800; line-height: 1.2; font-family: var(--font-arabic); }\n    .settings-close {\n        display: grid; place-items: center;\n        width: 36px; height: 36px; padding: 0 0 3px;\n        border: 1px solid rgba(21,91,56,.25); border-radius: 50%;\n        color: #155b38; background: #f1f6f2;\n        cursor: pointer; font-size: 26px; font-weight: bold; line-height: 1;\n    }\n    .settings-description { margin: 12px 0; color: #55635a; font-size: clamp(12px, 2.2vw, 15px); line-height: 1.5; font-family: var(--font-arabic); }\n    .settings-prayers, .settings-special { display: grid; gap: 8px; }\n    .settings-special { margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(21,91,56,.26); }\n    .settings-row {\n        display: flex; align-items: center; justify-content: space-between;\n        gap: 12px; min-height: 52px; padding: 8px 12px;\n        border: 1px solid rgba(91,110,99,.25); border-radius: 10px;\n        background: #f8fbf8;\n    }\n    .settings-row > div:first-child { min-width: 0; }\n    .prayer-controls { display: flex; align-items: flex-end; flex: 0 0 auto; gap: 12px; }\n    .control-field { display: flex; align-items: center; flex-direction: column; gap: 3px; }\n    .control-field > span { color: #55635a; font-size: 11px; font-weight: 700; line-height: 1; font-family: var(--font-arabic); }\n    .settings-row strong { display: block; color: #101613; font-size: clamp(14px, 2.6vw, 18px); font-weight: 700; line-height: 1.2; font-family: var(--font-arabic); }\n    .settings-row small { display: block; margin-top: 2px; color: #647369; font-size: clamp(10px, 2vw, 13px); line-height: 1.2; font-family: var(--font-arabic); }\n    .minute-control { display: flex; align-items: center; flex: 0 0 auto; gap: 4px; direction: ltr; }\n    .minute-control button {\n        display: grid; place-items: center;\n        width: 30px; height: 30px; padding: 0 0 2px;\n        border: 0; border-radius: 6px;\n        color: #fff; background: #155b38;\n        cursor: pointer; font-size: 20px; font-weight: bold; line-height: 1;\n    }\n    .minute-control button:hover { background: #0b4428; }\n    .minute-control input {\n        width: 50px; height: 30px; padding: 0 2px;\n        border: 1px solid rgba(21,91,56,.4); border-radius: 6px;\n        color: #155b38; background: #fff;\n        font-family: var(--font-numbers);\n        font-size: 15px; font-weight: 700; text-align: center;\n    }\n    .minute-control em { color: #55635a; font-size: 11px; font-style: normal; white-space: nowrap; font-family: var(--font-arabic); }\n    .settings-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }\n    .settings-actions button {\n        min-height: 40px; padding: 6px 20px; border-radius: 8px;\n        cursor: pointer; font-size: clamp(12px, 2.4vw, 15px);\n        font-weight: 700; font-family: var(--font-arabic);\n    }\n    .reset-button { border: 1px solid rgba(138,22,64,.4); color: #8a1640; background: #fff; }\n    .save-button { border: 1px solid #155b38; color: #fff; background: #155b38; }\n\n    /* ========================================\n       إبقاء الشاشة مضاءة\n       ======================================== */\n /* إلغاء تأثير الثواني */\n.clock-frame time.pulse {\n    animation: none !important;\n    transform: none !important;\n}\n    .clock-frame time.pulse {\n        animation: pulse 0.5s ease-out;\n    }\n\n    /* للأجهزة المحمولة */\n    @media (max-width: 600px) {\n        :root {\n            --clock-size: clamp(32px, 10vw, 60px);\n            --prayer-name-size: clamp(18px, 6vw, 40px);\n            --prayer-time-size: clamp(20px, 7vw, 50px);\n            --countdown-number-size: clamp(16px, 5vw, 35px);\n            --prayer-min-height: clamp(20px, 4vh, 35px);\n            --prayer-border-radius: 15px;\n        }\n        .date-card { min-width: 80px; padding: 4px 8px; }\n        .date-card .date-value { font-size: clamp(12px, 2.5vw, 20px); }\n        .date-card .date-label { font-size: clamp(8px, 1.5vw, 12px); }\n        .weekday { font-size: clamp(12px, 3vw, 20px); }\n\n        \n    }",

        "name": "index1.html",
        "style": "/* =========================================================\n   التصميم الجديد بالكامل\n   ========================================================= */\n\n:root {\n\n    /* =========================\n       الخطوط\n       ========================= */\n\n    --font-arabic: \"Noto Kufi Arabic\", sans-serif;\n    --font-numbers: \"Fjalla One\", monospace;\n    --font-clock: \"Roboto Mono\", monospace;\n\n\n    /* =========================\n       الألوان\n       ========================= */\n\n    --bg-main: #00c4b0;\n\n    --text-primary: #f4f7f5;\n\n    --text-prayer-name: #f4f7f5;\n\n    --text-prayer-time: #f4f7f5;\n\n    --text-prayer-active: #d9b45a;\n\n    --text-clock: #ffffff;\n\n    --text-date: #d9b45a;\n\n    --text-gregorian: #c7d0cc;\n\n    --text-secondary: #aebbb5;\n\n    --accent: #d9b45a;\n\n    --accent-light: #efd58b;\n\n    --line: rgba(217,180,90,.45);\n\n    --line-soft: rgba(255,255,255,.13);\n\n    --footer-bg: #006c73;\n\n    --footer-text: #ffffff;\n\n\n    /* =========================\n       الأحجام\n       ========================= */\n\n    --clock-size: clamp(70px, 10vw, 150px);\n\n    --weekday-size: clamp(22px, 3vw, 42px);\n\n    --date-size: clamp(18px, 2.5vw, 34px);\n\n    --prayer-name-size: clamp(42px, 6vw, 82px);\n\n    --prayer-time-size: clamp(62px, 8vw, 130px);\n\n    --countdown-label-size: clamp(18px, 2vw, 30px);\n\n    --countdown-number-size: clamp(45px, 5vw, 80px);\n\n\n    --container-padding: 18px 32px 0;\n}\n\n\n/* =========================================================\n   RESET\n   ========================================================= */\n\n* {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\n\nhtml,\nbody {\n\n    width: 100vw;\n    height: 100vh;\n\n    margin: 0;\n    padding: 0;\n\n    overflow: hidden;\n\n    background: var(--bg-main);\n}\n\n\n/* =========================================================\n   الشاشة الرئيسية\n   ========================================================= */\n\n.mosque-screen {\n\n    position: absolute;\n\n    top: 0;\n    left: 0;\n\n    isolation: isolate;\n\n    display: flex;\n\n    flex-direction: column;\n\n    width: 100vh;\n    height: 100vw;\n\n    margin: 0;\n\n    padding: var(--container-padding);\n\n    overflow: hidden;\n\n    color: var(--text-primary);\n\n    background-color: var(--bg-main);\n\n    background-image:\n        linear-gradient(\n            rgba(4,14,12,.72),\n            rgba(4,14,12,.82)\n        ),\n        url('bg.jpg');\n\n    background-size: cover;\n    background-position: center;\n    background-repeat: no-repeat;\n\n    transform: rotate(90deg) translateY(-100%);\n\n    transform-origin: top left;\n}\n\n\n@media (orientation: portrait) {\n\n    .mosque-screen {\n\n        width: 100vw;\n        height: 100vh;\n\n        transform: none;\n    }\n}\n\n\n/* =========================================================\n   الحاوية\n   ========================================================= */\n\n.fit-content {\n\n    display: flex;\n\n    flex-direction: column;\n\n    flex: 1 1 0;\n\n    min-height: 0;\n\n    width: 100%;\n\n    justify-content: space-between;\n}\n\n\n/* =========================================================\n   إلغاء شكل البطاقات القديمة\n   ========================================================= */\n\n.prayer-row,\n.clock-frame,\n.date-card {\n\n    background: transparent !important;\n\n    backdrop-filter: none !important;\n\n    box-shadow: none !important;\n}\n\n\n/* =========================================================\n   الخلفية الإضافية القديمة\n   ========================================================= */\n\n.soft-pattern {\n\n    display: none !important;\n}\n\n\n/* =========================================================\n   زر الإعدادات\n   ========================================================= */\n\n.settings-button {\n\n    position: absolute;\n\n    top: 20px;\n    right: 25px;\n\n    z-index: 4;\n\n    display: grid;\n\n    place-items: center;\n\n    width: 48px;\n    height: 48px;\n\n    padding: 0;\n\n    border: 1px solid rgba(217,180,90,.45);\n\n    border-radius: 8px;\n\n    color: var(--accent);\n\n    background: rgba(7,19,17,.7);\n\n    cursor: pointer;\n\n    box-shadow: none;\n\n    transition:\n        background .2s ease,\n        border-color .2s ease;\n}\n\n\n.settings-button:hover {\n\n    background: rgba(217,180,90,.12);\n\n    border-color: var(--accent);\n}\n\n\n.settings-button svg {\n\n    width: 60%;\n    height: 60%;\n\n    fill: currentColor;\n}\n\n\n/* =========================================================\n   الساعة\n   ========================================================= */\n\n.clock-frame {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    flex-shrink: 0;\n\n    width: 100%;\n\n    min-height: clamp(100px, 14vh, 170px);\n\n    margin: 0 auto;\n\n    padding: 5px 0;\n\n    border: none;\n\n    border-radius: 0;\n\n    background: transparent !important;\n\n    box-shadow: none !important;\n}\n\n\n.clock-frame time {\n\n    direction: ltr;\n\n    color: var(--text-clock);\n\n    font-family: var(--font-clock);\n\n    font-size: var(--clock-size) !important;\n\n    font-weight: 600;\n\n    letter-spacing: 5px;\n\n    line-height: 1;\n\n    white-space: nowrap;\n\n    font-variant-numeric: tabular-nums;\n\n    /* مهم:\n       لا حركة ولا اهتزاز عند تغير الثانية\n    */\n\n    animation: none !important;\n\n    transform: none !important;\n\n    transition: none !important;\n}\n\n\n/* =========================================================\n   التاريخ\n   ========================================================= */\n\n.date-block {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    flex-direction: column;\n\n    gap: 5px;\n\n    flex-shrink: 0;\n\n    width: 100%;\n\n    max-width: none;\n\n    margin: 2px auto 12px;\n\n    flex-wrap: nowrap;\n}\n\n\n/* اليوم */\n\n.weekday {\n\n    width: 100%;\n\n    text-align: center;\n\n    color: var(--accent);\n\n    font-family: var(--font-arabic);\n\n    font-size: var(--weekday-size);\n\n    font-weight: 800;\n\n    line-height: 1.2;\n\n    margin: 0;\n}\n\n\n/* =========================================================\n   إلغاء البطاقات حول التاريخ\n   ========================================================= */\n\n.date-card {\n\n    display: inline-flex;\n\n    flex-direction: row;\n\n    align-items: center;\n\n    justify-content: center;\n\n    padding: 0;\n\n    border: none !important;\n\n    border-radius: 0;\n\n    background: transparent !important;\n\n    min-width: 0;\n\n    box-shadow: none !important;\n\n    gap: 12px;\n}\n\n\n.date-card .date-label {\n\n    color: var(--text-secondary);\n\n    font-size: clamp(15px, 1.8vw, 23px);\n\n    font-weight: 500;\n\n    font-family: var(--font-arabic);\n\n    margin: 0;\n\n    opacity: 1;\n}\n\n\n.date-card .date-value {\n\n    color: var(--text-primary);\n\n    font-size: var(--date-size);\n\n    font-weight: 700;\n\n    font-family: var(--font-arabic);\n\n    line-height: 1.3;\n\n    text-align: center;\n}\n\n\n.date-card .date-value .day-number {\n\n    font-family: var(--font-numbers);\n\n    font-weight: 700;\n}\n\n\n.date-card.hijri-card {\n\n    border: none !important;\n}\n\n\n.date-card.hijri-card .date-label {\n\n    color: var(--accent);\n}\n\n\n/* =========================================================\n   قائمة الصلوات\n   ========================================================= */\n\n.prayer-list {\n\n    display: flex;\n\n    flex-direction: column;\n\n    flex: 1 1 auto;\n\n    justify-content: space-evenly;\n\n    min-height: 0;\n\n    width: 100%;\n\n    max-width: 100%;\n\n    margin: 0 auto;\n\n    padding: 5px 0;\n\n    gap: 0;\n}\n\n\n/* =========================================================\n   سطر الصلاة\n   بدون بطاقة\n   بدون إطار\n   بدون خلفية\n   ========================================================= */\n\n.prayer-row {\n\n    position: relative;\n\n    display: grid;\n\n    grid-template-columns: 1fr 1fr;\n\n    align-items: center;\n\n    justify-content: center;\n\n    flex: 1 1 0;\n\n    min-height: 0;\n\n    padding: 0 45px;\n\n    column-gap: 200px;\n\n    border: none !important;\n\n    border-radius: 0;\n\n    background: transparent !important;\n\n    overflow: visible;\n\n    direction: ltr;\n\n    box-shadow: none !important;\n}\n\n\n/* خط فاصل خفيف بين الصلوات */\n\n.prayer-row:not(:last-child)::after {\n\n    content: \"\";\n\n    position: absolute;\n\n    bottom: 0;\n\n    left: 10%;\n\n    width: 80%;\n\n    height: 1px;\n\n    background: var(--line-soft);\n}\n\n\n/* =========================================================\n   الصلاة القادمة\n   ========================================================= */\n\n.prayer-row.next-prayer {\n\n    border: none !important;\n\n    background: transparent !important;\n\n    box-shadow: none !important;\n}\n\n\n/* خط ذهبي للصلاة القادمة */\n\n.prayer-row.next-prayer::before {\n\n    content: \"\";\n\n    position: absolute;\n\n    right: 0;\n\n    top: 12%;\n\n    width: 5px;\n\n    height: 76%;\n\n    background: var(--accent);\n\n    border-radius: 0;\n}\n\n\n/* =========================================================\n   اسم الصلاة\n   ========================================================= */\n\n.prayer-row strong {\n\n    color: var(--text-prayer-name);\n\n    direction: rtl;\n\n   font-family: \"Alyamama\", sans-serif !important;\n\n    font-size: var(--prayer-name-size) !important;\n\n    font-weight: 900;\n\n    line-height: 1;\n\n    white-space: nowrap;\n\n    text-align: center;\n}\n\n\n.prayer-row.next-prayer strong {\n\n    color: var(--accent-light);\n}\n\n\n/* =========================================================\n   وقت الصلاة\n   ========================================================= */\n\n.prayer-row time {\n\n    color: var(--text-prayer-time);\n\n    direction: ltr;\n\n    font-family: var(--font-numbers);\n\n    font-size: var(--prayer-time-size) !important;\n\n    font-weight: 700;\n\n    line-height: 1;\n\n    letter-spacing: .02em;\n\n    white-space: nowrap;\n\n    text-align: center;\n\n    font-variant-numeric: tabular-nums;\n}\n\n\n.prayer-row.next-prayer time {\n\n    color: var(--accent);\n}\n\n\n/* =========================================================\n   العد التنازلي\n   ========================================================= */\n\n.countdown-footer {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    flex: 0 0 clamp(130px, 18vh, 210px);\n\n    width: calc(100% + 64px);\n    margin-right: -32px;\n    margin-left: -32px;\n\n    padding: 15px 20px;\n\n    color: var(--footer-text);\n    background: var(--footer-bg);\n\n    direction: ltr;\n\n    border-top: 1px solid rgba(217,180,90,.35);\n}\n\n\n.countdown-column {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    flex-direction: column;\n\n    gap: 8px;\n\n    direction: rtl;\n\n    white-space: nowrap;\n}\n\n\n.countdown-column span {\n\n    color: var(--accent);\n\n    font-family: var(--font-arabic);\n\n    font-size: clamp(22px, 2.5vw, 34px) !important;\n\n    font-weight: 600;\n\n    line-height: 1.2;\n\n    white-space: nowrap;\n}\n\n\n.countdown-column strong {\n\n    margin-top: 0;\n\n    direction: ltr;\n\n    color: #ffffff;\n\n    font-family: var(--font-numbers);\n\n    font-size: clamp(50px, 5.5vw, 90px) !important;\n\n    font-weight: 700;\n\n    line-height: 1;\n\n    white-space: nowrap;\n}\n\n\n/* =========================================================\n   الإعدادات\n   ========================================================= */\n\n.settings-layer {\n\n    position: absolute;\n\n    inset: 0;\n\n    z-index: 9999;\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    background: rgba(0,0,0,.82);\n\n    backdrop-filter: blur(3px);\n\n    padding: 16px;\n}\n\n\n.settings-panel {\n\n    display: flex;\n\n    flex-direction: column;\n\n    width: 95%;\n\n    max-width: 850px;\n\n    height: 96%;\n\n    max-height: 96%;\n\n    padding: 24px 28px;\n\n    border-radius: 6px;\n\n    border: 1px solid rgba(217,180,90,.45);\n\n    background: #0b1916;\n\n    box-shadow: none;\n\n    overflow-y: auto;\n}\n\n\n.settings-header {\n\n    display: flex;\n\n    align-items: flex-start;\n\n    justify-content: space-between;\n\n    gap: 18px;\n\n    padding-bottom: 14px;\n\n    border-bottom: 1px solid rgba(217,180,90,.25);\n}\n\n\n.settings-header span {\n\n    display: block;\n\n    color: var(--accent);\n\n    font-size: clamp(12px, 2.2vw, 16px);\n\n    font-weight: 600;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-header h2 {\n\n    margin: 2px 0 0;\n\n    color: #ffffff;\n\n    font-size: clamp(22px, 4vw, 34px);\n\n    font-weight: 800;\n\n    line-height: 1.2;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-close {\n\n    display: grid;\n\n    place-items: center;\n\n    width: 40px;\n\n    height: 40px;\n\n    padding: 0 0 3px;\n\n    border: 1px solid rgba(217,180,90,.4);\n\n    border-radius: 4px;\n\n    color: var(--accent);\n\n    background: transparent;\n\n    cursor: pointer;\n\n    font-size: 26px;\n\n    font-weight: bold;\n\n    line-height: 1;\n}\n\n\n.settings-description {\n\n    margin: 14px 0;\n\n    color: #aebbb5;\n\n    font-size: clamp(12px, 2.2vw, 15px);\n\n    line-height: 1.6;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-prayers,\n.settings-special {\n\n    display: grid;\n\n    gap: 8px;\n}\n\n\n.settings-special {\n\n    margin-top: 14px;\n\n    padding-top: 14px;\n\n    border-top: 1px dashed rgba(217,180,90,.3);\n}\n\n\n.settings-row {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: space-between;\n\n    gap: 12px;\n\n    min-height: 52px;\n\n    padding: 8px 12px;\n\n    border: 1px solid rgba(255,255,255,.12);\n\n    border-radius: 4px;\n\n    background: rgba(255,255,255,.035);\n}\n\n\n.settings-row > div:first-child {\n\n    min-width: 0;\n}\n\n\n.prayer-controls {\n\n    display: flex;\n\n    align-items: flex-end;\n\n    flex: 0 0 auto;\n\n    gap: 12px;\n}\n\n\n.control-field {\n\n    display: flex;\n\n    align-items: center;\n\n    flex-direction: column;\n\n    gap: 3px;\n}\n\n\n.control-field > span {\n\n    color: #aebbb5;\n\n    font-size: 11px;\n\n    font-weight: 700;\n\n    line-height: 1;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-row strong {\n\n    display: block;\n\n    color: #ffffff;\n\n    font-size: clamp(14px, 2.6vw, 18px);\n\n    font-weight: 700;\n\n    line-height: 1.2;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-row small {\n\n    display: block;\n\n    margin-top: 2px;\n\n    color: #82918b;\n\n    font-size: clamp(10px, 2vw, 13px);\n\n    line-height: 1.2;\n\n    font-family: var(--font-arabic);\n}\n\n\n/* =========================================================\n   التحكم بالدقائق\n   ========================================================= */\n\n.minute-control {\n\n    display: flex;\n\n    align-items: center;\n\n    flex: 0 0 auto;\n\n    gap: 4px;\n\n    direction: ltr;\n}\n\n\n.minute-control button {\n\n    display: grid;\n\n    place-items: center;\n\n    width: 32px;\n\n    height: 32px;\n\n    padding: 0 0 2px;\n\n    border: 0;\n\n    border-radius: 3px;\n\n    color: #071311;\n\n    background: var(--accent);\n\n    cursor: pointer;\n\n    font-size: 20px;\n\n    font-weight: bold;\n\n    line-height: 1;\n}\n\n\n.minute-control button:hover {\n\n    background: var(--accent-light);\n}\n\n\n.minute-control input {\n\n    width: 52px;\n\n    height: 32px;\n\n    padding: 0 2px;\n\n    border: 1px solid rgba(217,180,90,.5);\n\n    border-radius: 3px;\n\n    color: var(--accent);\n\n    background: #071311;\n\n    font-family: var(--font-numbers);\n\n    font-size: 15px;\n\n    font-weight: 700;\n\n    text-align: center;\n}\n\n\n.minute-control em {\n\n    color: #aebbb5;\n\n    font-size: 11px;\n\n    font-style: normal;\n\n    white-space: nowrap;\n\n    font-family: var(--font-arabic);\n}\n\n\n/* =========================================================\n   أزرار الإعدادات\n   ========================================================= */\n\n.settings-actions {\n\n    display: flex;\n\n    justify-content: space-between;\n\n    gap: 12px;\n\n    margin-top: 18px;\n}\n\n\n.settings-actions button {\n\n    min-height: 42px;\n\n    padding: 6px 22px;\n\n    border-radius: 3px;\n\n    cursor: pointer;\n\n    font-size: clamp(12px, 2.4vw, 15px);\n\n    font-weight: 700;\n\n    font-family: var(--font-arabic);\n}\n\n\n.reset-button {\n\n    border: 1px solid rgba(217,180,90,.5);\n\n    color: var(--accent);\n\n    background: transparent;\n}\n\n\n.save-button {\n\n    border: 1px solid var(--accent);\n\n    color: #071311;\n\n    background: var(--accent);\n}\n\n\n/* =========================================================\n   إلغاء حركة الساعة تمامًا\n   ========================================================= */\n\n.clock-frame time.pulse {\n\n    animation: none !important;\n\n    transform: none !important;\n\n    transition: none !important;\n}\n\n\n@keyframes pulse {\n\n    0%,\n    100% {\n\n        transform: none;\n    }\n}\n\n\n/* =========================================================\n   الشاشات الصغيرة\n   ========================================================= */\n\n@media (max-width: 600px) {\n\n    :root {\n\n        --clock-size: clamp(42px, 11vw, 70px);\n\n        --weekday-size: clamp(16px, 3vw, 24px);\n\n        --date-size: clamp(14px, 2.8vw, 22px);\n\n        --prayer-name-size: clamp(22px, 6vw, 42px);\n\n        --prayer-time-size: clamp(30px, 7vw, 55px);\n\n        --countdown-number-size: clamp(25px, 5vw, 40px);\n    }\n\n\n    .mosque-screen {\n\n        padding: 10px 16px 0;\n    }\n\n\n    .prayer-row {\n\n        padding: 0 20px;\n\n        grid-template-columns: 1fr 1fr;\n    }\n\n\n    .prayer-row.next-prayer::before {\n\n        width: 3px;\n    }\n\n\n    .countdown-footer {\n\n        width: calc(100% + 32px);\n\n        margin-right: -16px;\n\n        margin-left: -16px;\n\n        padding-left: 18px;\n\n        padding-right: 18px;\n    }\n\n\n    .settings-button {\n\n        width: 38px;\n\n        height: 38px;\n\n        top: 10px;\n\n        right: 12px;\n    }\n\n\n    .date-card {\n\n        gap: 7px;\n    }\n}",

        "style": "/* =========================================================\n   التصميم الجديد بالكامل\n   ========================================================= */\n\n:root {\n\n    /* =========================\n       الخطوط\n       ========================= */\n\n    --font-arabic: \"Noto Kufi Arabic\", sans-serif;\n    --font-numbers: \"Fjalla One\", monospace;\n    --font-clock: \"Roboto Mono\", monospace;\n\n\n    /* =========================\n       الألوان\n       ========================= */\n\n    --bg-main: #005352;\n\n    --text-primary: #f4f7f5;\n\n    --text-prayer-name: #f4f7f5;\n\n    --text-prayer-time: #f4f7f5;\n\n    --text-prayer-active: #d9b45a;\n\n    --text-clock: #ffffff;\n\n    --text-date: #d9b45a;\n\n    --text-gregorian: #c7d0cc;\n\n    --text-secondary: #aebbb5;\n\n    --accent: #d9b45a;\n\n    --accent-light: #efd58b;\n\n    --line: rgba(217,180,90,.45);\n\n    --line-soft: rgba(255,255,255,.13);\n\n    --footer-bg: #0f5458;\n\n    --footer-text: #ffffff;\n\n\n    /* =========================\n       الأحجام\n       ========================= */\n\n    --clock-size: clamp(70px, 10vw, 150px);\n\n    --weekday-size: clamp(22px, 3vw, 42px);\n\n    --date-size: clamp(18px, 2.5vw, 34px);\n\n    --prayer-name-size: clamp(42px, 6vw, 82px);\n\n    --prayer-time-size: clamp(62px, 8vw, 130px);\n\n    --countdown-label-size: clamp(18px, 2vw, 30px);\n\n    --countdown-number-size: clamp(45px, 5vw, 80px);\n\n\n    --container-padding: 18px 32px 0;\n}\n\n\n/* =========================================================\n   RESET\n   ========================================================= */\n\n* {\n    box-sizing: border-box;\n    margin: 0;\n    padding: 0;\n}\n\n\nhtml,\nbody {\n\n    width: 100vw;\n    height: 100vh;\n\n    margin: 0;\n    padding: 0;\n\n    overflow: hidden;\n\n    background: var(--bg-main);\n}\n\n\n/* =========================================================\n   الشاشة الرئيسية\n   ========================================================= */\n\n.mosque-screen {\n\n    position: absolute;\n\n    top: 0;\n    left: 0;\n\n    isolation: isolate;\n\n    display: flex;\n\n    flex-direction: column;\n\n    width: 100vh;\n    height: 100vw;\n\n    margin: 0;\n\n    padding: var(--container-padding);\n\n    overflow: hidden;\n\n    color: var(--text-primary);\n\n    background-color: var(--bg-main);\n\n    background-image:\n        linear-gradient(\n            rgba(1, 99, 78, 0.831),\n            rgb(0, 10, 30)\n        ),\n        url('bg.jpg');\n\n    background-size: cover;\n    background-position: center;\n    background-repeat: no-repeat;\n\n    transform: rotate(90deg) translateY(-100%);\n\n    transform-origin: top left;\n}\n\n\n@media (orientation: portrait) {\n\n    .mosque-screen {\n\n        width: 100vw;\n        height: 100vh;\n\n        transform: none;\n    }\n}\n\n\n/* =========================================================\n   الحاوية\n   ========================================================= */\n\n.fit-content {\n\n    display: flex;\n\n    flex-direction: column;\n\n    flex: 1 1 0;\n\n    min-height: 0;\n\n    width: 100%;\n\n    justify-content: space-between;\n}\n\n\n/* =========================================================\n   إلغاء شكل البطاقات القديمة\n   ========================================================= */\n\n.prayer-row,\n.clock-frame,\n.date-card {\n\n    background: transparent !important;\n\n    backdrop-filter: none !important;\n\n    box-shadow: none !important;\n}\n\n\n/* =========================================================\n   الخلفية الإضافية القديمة\n   ========================================================= */\n\n.soft-pattern {\n\n    display: none !important;\n}\n\n\n/* =========================================================\n   زر الإعدادات\n   ========================================================= */\n\n.settings-button {\n\n    position: absolute;\n\n    top: 20px;\n    right: 25px;\n\n    z-index: 4;\n\n    display: grid;\n\n    place-items: center;\n\n    width: 48px;\n    height: 48px;\n\n    padding: 0;\n\n    border: 1px solid rgba(217,180,90,.45);\n\n    border-radius: 8px;\n\n    color: var(--accent);\n\n    background: rgba(7,19,17,.7);\n\n    cursor: pointer;\n\n    box-shadow: none;\n\n    transition:\n        background .2s ease,\n        border-color .2s ease;\n}\n\n\n.settings-button:hover {\n\n    background: rgba(217,180,90,.12);\n\n    border-color: var(--accent);\n}\n\n\n.settings-button svg {\n\n    width: 60%;\n    height: 60%;\n\n    fill: currentColor;\n}\n\n\n/* =========================================================\n   الساعة\n   ========================================================= */\n\n.clock-frame {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    flex-shrink: 0;\n\n    width: 100%;\n\n    min-height: clamp(100px, 14vh, 170px);\n\n    margin: 0 auto;\n\n    padding: 5px 0;\n\n    border: none;\n\n    border-radius: 0;\n\n    background: transparent !important;\n\n    box-shadow: none !important;\n}\n\n\n.clock-frame time {\n\n    direction: ltr;\n\n    color: var(--text-clock);\n\n    font-family: var(--font-clock);\n\n    font-size: var(--clock-size) !important;\n\n    font-weight: 600;\n\n    letter-spacing: 5px;\n\n    line-height: 1;\n\n    white-space: nowrap;\n\n    font-variant-numeric: tabular-nums;\n\n    /* مهم:\n       لا حركة ولا اهتزاز عند تغير الثانية\n    */\n\n    animation: none !important;\n\n    transform: none !important;\n\n    transition: none !important;\n}\n\n\n/* =========================================================\n   التاريخ\n   ========================================================= */\n\n.date-block {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    flex-direction: column;\n\n    gap: 5px;\n\n    flex-shrink: 0;\n\n    width: 100%;\n\n    max-width: none;\n\n    margin: 2px auto 12px;\n\n    flex-wrap: nowrap;\n}\n\n\n/* اليوم */\n\n.weekday {\n\n    width: 100%;\n\n    text-align: center;\n\n    color: var(--accent);\n\n    font-family: var(--font-arabic);\n\n    font-size: var(--weekday-size);\n\n    font-weight: 800;\n\n    line-height: 1.2;\n\n    margin: 0;\n}\n\n\n/* =========================================================\n   إلغاء البطاقات حول التاريخ\n   ========================================================= */\n\n.date-card {\n\n    display: inline-flex;\n\n    flex-direction: row;\n\n    align-items: center;\n\n    justify-content: center;\n\n    padding: 0;\n\n    border: none !important;\n\n    border-radius: 0;\n\n    background: transparent !important;\n\n    min-width: 0;\n\n    box-shadow: none !important;\n\n    gap: 12px;\n}\n\n\n.date-card .date-label {\n\n    color: var(--text-secondary);\n\n    font-size: clamp(15px, 1.8vw, 23px);\n\n    font-weight: 500;\n\n    font-family: var(--font-arabic);\n\n    margin: 0;\n\n    opacity: 1;\n}\n\n\n.date-card .date-value {\n\n    color: var(--text-primary);\n\n    font-size: var(--date-size);\n\n    font-weight: 700;\n\n    font-family: var(--font-arabic);\n\n    line-height: 1.3;\n\n    text-align: center;\n}\n\n\n.date-card .date-value .day-number {\n\n    font-family: var(--font-numbers);\n\n    font-weight: 700;\n}\n\n\n.date-card.hijri-card {\n\n    border: none !important;\n}\n\n\n.date-card.hijri-card .date-label {\n\n    color: var(--accent);\n}\n\n\n/* =========================================================\n   قائمة الصلوات\n   ========================================================= */\n\n.prayer-list {\n\n    display: flex;\n\n    flex-direction: column;\n\n    flex: 1 1 auto;\n\n    justify-content: space-evenly;\n\n    min-height: 0;\n\n    width: 100%;\n\n    max-width: 100%;\n\n    margin: 0 auto;\n\n    padding: 5px 0;\n\n    gap: 0;\n}\n\n\n/* =========================================================\n   سطر الصلاة\n   بدون بطاقة\n   بدون إطار\n   بدون خلفية\n   ============================================== r;\n\n    font-family: var(--font-numbers);\n\n    font-size: var(--prayer-time-size) !important;\n\n    font-weight: 700;\n\n    line-height: 1;\n\n    letter-spacing: .02em;\n\n    white-space: nowrap;\n\n    text-align: center;\n\n    font-variant-numeric: tabular-nums;\n}\n\n\n.prayer-row.next-prayer time {\n\n    color: var(--accent);\n}\n\n\n/* =========================================================\n   العد التنازلي\n   ========================================================= */\n\n.countdown-footer {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n\n    flex: 0 0 clamp(130px, 18vh, 210px);\n\n    width: calc(100% + 64px);\n    margin-right: -32px;\n    margin-left: -32px;\n\n    padding: 15px 20px;\n\n    color: var(--footer-text);\n    background: var(--footer-bg);\n\n    direction: ltr;\n\n    border-top: 1px solid rgba(217,180,90,.35);\n}\n\n\n.countdown-column {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    flex-direction: column;\n\n    gap: 8px;\n\n    direction: rtl;\n\n    white-space: nowrap;\n}\n\n\n.countdown-column span {\n\n    color: var(--accent);\n\n    font-family: var(--font-arabic);\n\n    font-size: clamp(22px, 2.5vw, 34px) !important;\n\n    font-weight: 600;\n\n    line-height: 1.2;\n\n    white-space: nowrap;\n}\n\n\n.countdown-column strong {\n\n    margin-top: 0;\n\n    direction: ltr;\n\n    color: #ffffff;\n\n    font-family: var(--font-numbers);\n\n    font-size: clamp(50px, 5.5vw, 90px) !important;\n\n    font-weight: 700;\n\n    line-height: 1;\n\n    white-space: nowrap;\n}\n\n\n/* =========================================================\n   الإعدادات\n   ========================================================= */\n\n.settings-layer {\n\n    position: absolute;\n\n    inset: 0;\n\n    z-index: 9999;\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: center;\n\n    background: rgba(0,0,0,.82);\n\n    backdrop-filter: blur(3px);\n\n    padding: 16px;\n}\n\n\n.settings-panel {\n\n    display: flex;\n\n    flex-direction: column;\n\n    width: 95%;\n\n    max-width: 850px;\n\n    height: 96%;\n\n    max-height: 96%;\n\n    padding: 24px 28px;\n\n    border-radius: 6px;\n\n    border: 1px solid rgba(217,180,90,.45);\n\n    background: #0b1916;\n\n    box-shadow: none;\n\n    overflow-y: auto;\n}\n\n\n.settings-header {\n\n    display: flex;\n\n    align-items: flex-start;\n\n    justify-content: space-between;\n\n    gap: 18px;\n\n    padding-bottom: 14px;\n\n    border-bottom: 1px solid rgba(217,180,90,.25);\n}\n\n\n.settings-header span {\n\n    display: block;\n\n    color: var(--accent);\n\n    font-size: clamp(12px, 2.2vw, 16px);\n\n    font-weight: 600;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-header h2 {\n\n    margin: 2px 0 0;\n\n    color: #ffffff;\n\n    font-size: clamp(22px, 4vw, 34px);\n\n    font-weight: 800;\n\n    line-height: 1.2;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-close {\n\n    display: grid;\n\n    place-items: center;\n\n    width: 40px;\n\n    height: 40px;\n\n    padding: 0 0 3px;\n\n    border: 1px solid rgba(217,180,90,.4);\n\n    border-radius: 4px;\n\n    color: var(--accent);\n\n    background: transparent;\n\n    cursor: pointer;\n\n    font-size: 26px;\n\n    font-weight: bold;\n\n    line-height: 1;\n}\n\n\n.settings-description {\n\n    margin: 14px 0;\n\n    color: #aebbb5;\n\n    font-size: clamp(12px, 2.2vw, 15px);\n\n    line-height: 1.6;\n\n    font-family: var(--font-arabic);\n}\n\n\n.settings-prayers,\n.settings-special {\n\n    display: grid;\n\n    gap: 8px;\n}\n\n\n.settings-special {\n\n    margin-top: 14px;\n\n    padding-top: 14px;\n\n    border-top: 1px dashed rgba(217,180,90,.3);\n}\n\n\n.settings-row {\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: space-between;\n\n    gap: 12px;\n\n    min-height: 52px;\n\n    padding: 8px 12px;\n\n    border: 1px solid rgba(255,255,255,.12);\n\n -align: center;\n}\n\n\n.minute-control em {\n\n    color: #aebbb5;\n\n    font-size: 11px;\n\n    font-style: normal;\n\n    white-space: nowrap;\n\n    font-family: var(--font-arabic);\n}\n\n\n/* =========================================================\n   أزرار الإعدادات\n   ========================================================= */\n\n.settings-actions {\n\n    display: flex;\n\n    justify-content: space-between;\n\n    gap: 12px;\n\n    margin-top: 18px;\n}\n\n\n.settings-actions button {\n\n    min-height: 42px;\n\n    padding: 6px 22px;\n\n    border-radius: 3px;\n\n    cursor: pointer;\n\n    font-size: clamp(12px, 2.4vw, 15px);\n\n    font-weight: 700;\n\n    font-family: var(--font-arabic);\n}\n\n\n.reset-button {\n\n    border: 1px solid rgba(217,180,90,.5);\n\n    color: var(--accent);\n\n    background: transparent;\n}\n\n\n.save-button {\n\n    border: 1px solid var(--accent);\n\n    color: #071311;\n\n    background: var(--accent);\n}\n\n\n/* =========================================================\n   إلغاء حركة الساعة تمامًا\n   ========================================================= */\n\n.clock-frame time.pulse {\n\n    animation: none !important;\n\n    transform: none !important;\n\n    transition: none !important;\n}\n\n\n@keyframes pulse {\n\n    0%,\n    100% {\n\n        transform: none;\n    }\n}\n\n\n/* =========================================================\n   الشاشات الصغيرة\n   ========================================================= */\n\n@media (max-width: 600px) {\n\n    :root {\n\n        --clock-size: clamp(42px, 11vw, 70px);\n\n        --weekday-size: clamp(16px, 3vw, 24px);\n\n        --date-size: clamp(14px, 2.8vw, 22px);\n\n        --prayer-name-size: clamp(22px, 6vw, 42px);\n\n        --prayer-time-size: clamp(30px, 7vw, 55px);\n\n        --countdown-number-size: clamp(25px, 5vw, 40px);\n    }\n\n\n    .mosque-screen {\n\n        padding: 10px 16px 0;\n    }\n\n\n    .prayer-row {\n\n        padding: 0 20px;\n\n n}\n.date-block { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; margin: 10px auto 14px; }\n.weekday { color: var(--accent); font-family: var(--font-arabic); font-size: clamp(22px, 3.2vw, 42px); font-weight: 800; }\n.date-card {\n    display: inline-flex; gap: 12px; border: 1px solid rgba(249, 115, 22, 0.3) !important;\n    border-radius: 12px; padding: 6px 20px; background: rgba(69, 26, 3, 0.4) !important;\n}\n.date-card .date-label { color: var(--text-secondary); font-size: clamp(14px, 1.8vw, 22px); }\n.date-card .date-value { color: var(--text-primary); font-size: clamp(16px, 2.5vw, 32px); font-weight: 700; }\n.date-card .date-value .day-number { font-family: var(--font-numbers); }\n.prayer-list { display: flex; flex-direction: column; flex: 1 1 auto; justify-content: space-around; gap: 8px; margin: 0 auto; width: 100%; }\n.prayer-row {\n    position: relative; display: flex; align-items: center; justify-content: space-between;\n    flex: 1 1 0; padding: 0 35px; border: 1px solid rgba(249, 115, 22, 0.25) !important;\n    border-radius: 12px; background: rgba(255, 255, 255, 0.04) !important; direction: ltr;\n}\n.prayer-row.next-prayer {\n    border-color: #f97316 !important; background: rgba(249, 115, 22, 0.18) !important;\n    box-shadow: 0 0 18px rgba(249, 115, 22, 0.3) !important;\n}\n.prayer-row strong { color: var(--text-prayer-name); font-family: var(--font-arabic); font-size: clamp(34px, 5.2vw, 76px) !important; font-weight: 800; }\n.prayer-row.next-prayer strong { color: var(--accent-light); }\n.prayer-row time { color: var(--text-prayer-time); font-family: var(--font-numbers); font-size: clamp(44px, 6.8vw, 105px) !important; font-weight: 800; }\n.prayer-row.next-prayer time { color: var(--text-prayer-active); }\n.countdown-footer {\n    display: flex; align-items: center; justify-content: space-between; flex: 0 0 clamp(110px, 15vh, 180px);\n    width: calc(100% + 56px); margin-right: -28px; margin-left: -28px; padding: 12px 28px;\n    background: var(--footer-bg); border-top: 3px solid var(--accent); direction: ltr;\n}\n.countdown-column { display: flex; flex-direction: column; align-items: center; direction: rtl; }\n.countdown-column span { color: var(--accent); font-family: var(--font-arabic); font-size: clamp(20px, 2.4vw, 32px) !important; font-weight: 700; }\n.countdown-column strong { color: #ffffff; font-family: var(--font-numbers); font-size: clamp(44px, 5.2vw, 84px) !important; font-weight: 800; }\n.settings-layer { position: absolute; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.85); backdrop-filter: blur(5px); padding: 16px; }\n.settings-panel { display: flex; flex-direction: column; width: 95%; max-width: 850px; height: 96%; padding: 24px; border-radius: 12px; border: 1px solid var(--accent); background: #240c06; color: #fff; overflow-y: auto; }\n.settings-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid rgba(249,115,22,.3); padding-bottom: 12px; }\n.settings-header h2 { color: var(--accent); font-size: clamp(20px, 3.5vw, 30px); }\n.settings-close { width: 36px; height: 36px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; border-radius: 6px; font-size: 24px; }\n.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border: 1px solid rgba(249,115,22,.2); border-radius: 8px; background: rgba(255,255,255,.05); margin-bottom: 6px; }\n.minute-control button { width: 30px; height: 30px; border: 0; background: var(--accent); color: #000; font-weight: bold; border-radius: 4px; cursor: pointer; }\n.minute-control input { width: 48px; height: 30px; text-align: center; background: #000; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; }\n.settings-actions button { padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }\n.reset-button { border: 1px solid var(--accent); color: var(--accent); background: transparent; }\n.save-button { border: 1px solid var(--accent); color: #000; background: var(--accent); }",
        "prayerNames": [
            "الفـجــر",
            "الشروق",
            "الظهـر",
            "العصـر",
            "المغرب",
            "العشــاء"
        ]
    }
];
    const THEME_STORAGE_KEY = "mosque-display-theme";
    let currentThemeIndex = 0;

    function applyTheme(index) {
        currentThemeIndex = ((index % THEMES.length) + THEMES.length) % THEMES.length;
        try {
            localStorage.setItem(THEME_STORAGE_KEY, currentThemeIndex);
        } catch (e) {
            console.warn("Could not save theme:", e);
        }

        const theme = THEMES[currentThemeIndex];
        const styleEl = document.getElementById("active-theme-style");
        if (styleEl) {
            styleEl.textContent = theme.style;
        }

        if (theme.prayerNames && Array.isArray(prayerDefinitions)) {
            prayerDefinitions.forEach((def, i) => {
                if (theme.prayerNames[i]) {
                    def.name = theme.prayerNames[i];
                }
            });
        }
    }

    function loadTheme() {
        try {
            const stored = localStorage.getItem(THEME_STORAGE_KEY);
            if (stored !== null) {
                const parsed = parseInt(stored, 10);
                if (!isNaN(parsed) && parsed >= 0 && parsed < THEMES.length) {
                    currentThemeIndex = parsed;
                }
            }
        } catch (e) {
            console.warn("Could not load theme:", e);
        }
        applyTheme(currentThemeIndex);
    }

    function cycleTheme() {
        applyTheme(currentThemeIndex + 1);
        updateUI();
    }


    const prayerDefinitions = [
        { key: "fajr", name: "الفـجــر" },
        { key: "sunrise", name: "الشروق" },
        { key: "dhuhr", name: "الظهـر" },
        { key: "asr", name: "العصـر" },
        { key: "maghrib", name: "المغرب" },
        { key: "isha", name: "العشــاء" },
    ];

    function getDefaultSettings() {
        return {
            prayerOffsets: { fajr: 0, sunrise: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0 },
            iqamaDelays: { fajr: 10, sunrise: 10, dhuhr: 10, asr: 10, maghrib: 10, isha: 10 },
            hijriOffset: 0,
        };
    }

    let settings = getDefaultSettings();

    function clampMinutes(val) {
        return Math.max(-180, Math.min(180, Math.round(Number(val) || 0)));
    }

    function loadSettings() {
        try {
            const stored = localStorage.getItem(SETTINGS_STORAGE_KEY);
            if (stored) {
                const parsed = JSON.parse(stored);
                const defaults = getDefaultSettings();
                const legacyIqamaDelay = Number(parsed.iqamaDelay);
                const storedIqamaDelays = parsed.iqamaDelays || {};
                const iqamaDelays = { ...defaults.iqamaDelays };

                prayerDefinitions.forEach((def) => {
                    const savedVal = Number(storedIqamaDelays[def.key]);
                    const val = Number.isFinite(savedVal)
                        ? savedVal
                        : Number.isFinite(legacyIqamaDelay)
                        ? legacyIqamaDelay
                        : defaults.iqamaDelays[def.key];
                    iqamaDelays[def.key] = clampMinutes(val);
                });

                settings = {
                    prayerOffsets: { ...defaults.prayerOffsets, ...(parsed.prayerOffsets || {}) },
                    iqamaDelays,
                    hijriOffset: clampMinutes(Number(parsed.hijriOffset ?? defaults.hijriOffset)),
                };
            }
        } catch (err) {
            console.warn("Could not load settings:", err);
        }
    }

    function saveSettings() {
        try {
            localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
        } catch (err) {
            console.warn("Could not save settings:", err);
        }
    }

    // ============================================================
    // 3. دوال المعالجة
    // ============================================================
    function parsePrayerTimes(timesArray) {
        const rows = new Map();
        if (!Array.isArray(timesArray)) return rows;

        timesArray.forEach((line) => {
            if (typeof line !== "string") return;
            const cleanLine = line.replace(/["']/g, "").trim();
            const parts = cleanLine.split("~~~~~");
            if (parts.length === 2) {
                const dateKey = parts[0].trim();
                const times = parts[1].split("|").map((t) => t.trim());
                if (dateKey.match(/^\d{2}-\d{2}$/) && times.length === 6) {
                    rows.set(dateKey, times);
                }
            }
        });
        return rows;
    }

    const prayerTimesMap = parsePrayerTimes(JS_TIMES);

    function adjustPrayerTime(time, offset) {
        if (!time || time === "--:--") return "--:--";
        const [hours, minutes] = time.split(":").map(Number);
        const totalMinutes = (hours * 60 + minutes + offset + 1440) % 1440;
        const newHours = Math.floor(totalMinutes / 60);
        const newMinutes = totalMinutes % 60;
        return `${String(newHours).padStart(2, "0")}:${String(newMinutes).padStart(2, "0")}`;
    }

    function formatDisplayTime(time24) {
        if (!time24 || time24 === "--:--") return "--:--";
        const [hours, minutes] = time24.split(":").map(Number);
        const displayHours = hours % 12 || 12;
        return `${displayHours}:${String(minutes).padStart(2, "0")}`;
    }

    function toLatinDigits(val) {
        if (val === null || val === undefined) return "";
        const str = String(val);
        const arabicDigits = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
        return str.replace(/[٠-٩]/g, (d) => {
            const idx = arabicDigits.indexOf(d);
            return idx !== -1 ? String(idx) : d;
        });
    }

    function getBaghdadParts(date) {
        const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: TIME_ZONE,
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hourCycle: "h23",
        }).formatToParts(date);

        const get = (type) => Number(parts.find((p) => p.type === type)?.value ?? 0);
        return {
            year: get("year"), month: get("month"), day: get("day"),
            hour: get("hour"), minute: get("minute"), second: get("second"),
        };
    }

    function getBaghdadDate() {
        const parts = getBaghdadParts(new Date());
        return new Date(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
    }

    function getCalendarParts(date, calendar) {
        const formatter = new Intl.DateTimeFormat(
            calendar === "gregory" ? "ar-IQ" : "ar-IQ-u-ca-islamic-umalqura",
            { timeZone: TIME_ZONE, day: "numeric", month: "long", year: "numeric" }
        );
        const parts = formatter.formatToParts(date);
        return {
            day: parts.find((p) => p.type === "day")?.value ?? "",
            month: parts.find((p) => p.type === "month")?.value ?? "",
            year: parts.find((p) => p.type === "year")?.value ?? "",
        };
    }

    function formatClock(date) {
        let hours = date.getHours();
        let minutes = date.getMinutes();
        let seconds = date.getSeconds();
        hours = hours % 12 || 12;
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function toMinutes(time) {
        const [hours, minutes] = time.split(":").map(Number);
        return hours * 60 + minutes;
    }

    function formatCountdown(totalSeconds) {
        const safeSeconds = Math.max(0, totalSeconds);
        const hours = Math.floor(safeSeconds / 3600);
        const minutes = Math.floor((safeSeconds % 3600) / 60);
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
    }

    function makePrayerList(date, offsets) {
        const parts = getBaghdadParts(date);
        const dayKey = `${String(parts.month).padStart(2, "0")}-${String(parts.day).padStart(2, "0")}`;
        const times = prayerTimesMap.get(dayKey) || prayerTimesMap.get("01-01") || [];

        return prayerDefinitions.map((def, index) => ({
            ...def,
            time: adjustPrayerTime(times[index] || "--:--", offsets[def.key] || 0),
        }));
    }

    function getNextPrayer(prayers, now) {
        const currentMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        
        const upcoming = prayers.find((p) => {
            if (p.time === "--:--") return false;
            const adhanMinutes = toMinutes(p.time);
            const iqamaDelay = settings.iqamaDelays[p.key] || 0;
            return (adhanMinutes + iqamaDelay) > currentMinutes;
        });

        if (upcoming) {
            const target = new Date(now);
            const [hours, minutes] = upcoming.time.split(":").map(Number);
            target.setHours(hours, minutes, 0, 0);
            return { prayer: upcoming, target };
        }

        const first = prayers[0];
        const target = new Date(now);
        const [hours, minutes] = (first?.time || "00:00").split(":").map(Number);
        target.setDate(target.getDate() + 1);
        target.setHours(hours, minutes, 0, 0);
        return { prayer: first, target };
    }

    // ============================================================
    // 4. عناصر DOM
    // ============================================================
    const clockEl = document.getElementById("live-clock");
    const weekdayEl = document.getElementById("live-weekday");
    const hijriEl = document.getElementById("live-hijri");
    const gregorianEl = document.getElementById("live-gregorian");
    const prayerListContainer = document.getElementById("prayer-list-container");
    const countdownIqamaEl = document.getElementById("countdown-iqama");
    const countdownAdhanEl = document.getElementById("countdown-adhan");

    const settingsModal = document.getElementById("settings-modal");
    const openSettingsBtn = document.getElementById("open-settings");
    const closeSettingsBtn = document.getElementById("close-settings");
    const resetSettingsBtn = document.getElementById("reset-settings");
    const saveSettingsBtn = document.getElementById("save-settings");
    const settingsPrayersContainer = document.getElementById("settings-prayers-container");
    const hijriInput = document.getElementById("hijri-input");
    const hijriDecBtn = document.getElementById("hijri-dec");
    const hijriIncBtn = document.getElementById("hijri-inc");

    // ============================================================
    // 5. تحديث الواجهة
    // ============================================================
    function updateUI() {
        const now = new Date();
        const baghdadDate = getBaghdadDate();

        // الساعة
        clockEl.textContent = formatClock(baghdadDate);
        clockEl.setAttribute("dateTime", baghdadDate.toISOString());

        // اليوم
        weekdayEl.textContent = new Intl.DateTimeFormat("ar-IQ", {
            timeZone: TIME_ZONE,
            weekday: "long",
        }).format(now);

        // التاريخ الهجري
        const hijriDateObj = new Date(now);
        hijriDateObj.setDate(hijriDateObj.getDate() + settings.hijriOffset);
        const hijri = getCalendarParts(hijriDateObj, "islamic-umalqura");
        hijriEl.innerHTML = `
            <span class="day-number">${toLatinDigits(hijri.day)}</span>
            <span>${hijri.month}</span>
            <span>${toLatinDigits(hijri.year)}</span>
        `;

        // التاريخ الميلادي
        const gregorian = getCalendarParts(now, "gregory");
        gregorianEl.innerHTML = `
            <span class="day-number">${toLatinDigits(gregorian.day)}</span>
            <span>${gregorian.month}</span>
            <span>${toLatinDigits(gregorian.year)}</span>
        `;

        // الصلوات
        const prayers = makePrayerList(now, settings.prayerOffsets);
        const nextPrayerInfo = getNextPrayer(prayers, baghdadDate);

        prayerListContainer.innerHTML = "";
        prayers.forEach((p) => {
            const row = document.createElement("div");
            const isNext = p.key === nextPrayerInfo.prayer?.key;
            const isFajr = p.key === "fajr";
            const isSunrise = p.key === "sunrise";
            
            row.className = "prayer-row" + (isNext ? " next-prayer" : "");
            
            let cursorAttr = '';
            let titleAttr = '';
            if (isFajr) {
                cursorAttr = ' style="cursor: pointer;"';
                titleAttr = ' title="انقر هنا لتغيير الستايل (التصميم)"';
            } else if (isSunrise) {
                cursorAttr = ' style="cursor: pointer;"';
                titleAttr = ' title="انقر هنا لفتح الإعدادات"';
            }
            
            row.innerHTML = `<time>${formatDisplayTime(p.time)}</time><strong${cursorAttr}${titleAttr}>${p.name}</strong>`;
            
            if (isFajr) {
                row.style.cursor = "pointer";
                row.title = "انقر هنا لتغيير الستايل (التصميم)";
                row.addEventListener("click", cycleTheme);
            } else if (isSunrise) {
                row.style.cursor = "pointer";
                row.title = "انقر هنا لفتح الإعدادات";
                row.addEventListener("click", openSettingsModal);
            }
            
            prayerListContainer.appendChild(row);
        });

        // العد التنازلي للأذان والإقامة
        const secondsToNext = Math.round(
            (nextPrayerInfo.target.getTime() - baghdadDate.getTime()) / 1000
        );
        const nextIqamaDelay = nextPrayerInfo.prayer
            ? (settings.iqamaDelays[nextPrayerInfo.prayer.key] || 0) * 60
            : 0;

        const secondsToIqama = secondsToNext + nextIqamaDelay;

        countdownAdhanEl.textContent = formatCountdown(secondsToNext);
        countdownIqamaEl.textContent = formatCountdown(secondsToIqama);
    }
    // ============================================================
    // 6. الإعدادات
    // ============================================================
    function renderSettingsModal() {
        settingsPrayersContainer.innerHTML = "";
        const now = new Date();
        const prayers = makePrayerList(now, settings.prayerOffsets);

        prayers.forEach((p) => {
            const row = document.createElement("div");
            row.className = "settings-row";
            row.innerHTML = `
                <div>
                    <strong>${p.name}</strong>
                    <small>الوقت المعدل: ${p.time}</small>
                </div>
                <div class="prayer-controls">
                    <label class="control-field">
                        <span>الأذان</span>
                        <div class="minute-control">
                            <button type="button" data-action="offset-dec" data-key="${p.key}">−</button>
                            <input type="number" min="-180" max="180" data-action="offset-input" data-key="${p.key}" value="${settings.prayerOffsets[p.key] || 0}" />
                            <button type="button" data-action="offset-inc" data-key="${p.key}">+</button>
                            <em>دقيقة</em>
                        </div>
                    </label>
                    <label class="control-field">
                        <span>الإقامة</span>
                        <div class="minute-control">
                            <button type="button" data-action="iqama-dec" data-key="${p.key}">−</button>
                            <input type="number" min="-180" max="180" data-action="iqama-input" data-key="${p.key}" value="${settings.iqamaDelays[p.key] || 0}" />
                            <button type="button" data-action="iqama-inc" data-key="${p.key}">+</button>
                            <em>دقيقة</em>
                        </div>
                    </label>
                </div>
            `;
            settingsPrayersContainer.appendChild(row);
        });

        hijriInput.value = settings.hijriOffset;
    }

    // ============================================================
    // 7. الأحداث
    // ============================================================
    function openSettingsModal() {
        renderSettingsModal();
        settingsModal.style.display = "grid";
    }

    if (openSettingsBtn) {
        openSettingsBtn.addEventListener("click", openSettingsModal);
    }

    closeSettingsBtn.addEventListener("click", () => {
        settingsModal.style.display = "none";
    });

    saveSettingsBtn.addEventListener("click", () => {
        saveSettings();
        settingsModal.style.display = "none";
        updateUI();
    });

    resetSettingsBtn.addEventListener("click", () => {
        settings = getDefaultSettings();
        saveSettings();
        renderSettingsModal();
        updateUI();
    });

    settingsModal.addEventListener("click", (e) => {
        if (e.target === settingsModal) settingsModal.style.display = "none";
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && settingsModal.style.display !== "none") {
            settingsModal.style.display = "none";
        }
    });

    settingsPrayersContainer.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        const action = btn.dataset.action;
        const key = btn.dataset.key;
        if (!action || !key) return;

        if (action === "offset-dec") {
            settings.prayerOffsets[key] = clampMinutes((settings.prayerOffsets[key] || 0) - 1);
        } else if (action === "offset-inc") {
            settings.prayerOffsets[key] = clampMinutes((settings.prayerOffsets[key] || 0) + 1);
        } else if (action === "iqama-dec") {
            settings.iqamaDelays[key] = clampMinutes((settings.iqamaDelays[key] || 0) - 1);
        } else if (action === "iqama-inc") {
            settings.iqamaDelays[key] = clampMinutes((settings.iqamaDelays[key] || 0) + 1);
        }
        renderSettingsModal();
        updateUI();
    });

    settingsPrayersContainer.addEventListener("input", (e) => {
        const input = e.target;
        const action = input.dataset.action;
        const key = input.dataset.key;
        if (!action || !key) return;

        const val = clampMinutes(input.value);
        if (action === "offset-input") {
            settings.prayerOffsets[key] = val;
        } else if (action === "iqama-input") {
            settings.iqamaDelays[key] = val;
        }
        updateUI();
    });

    hijriDecBtn.addEventListener("click", () => {
        settings.hijriOffset = clampMinutes(settings.hijriOffset - 1);
        hijriInput.value = settings.hijriOffset;
        updateUI();
    });

    hijriIncBtn.addEventListener("click", () => {
        settings.hijriOffset = clampMinutes(settings.hijriOffset + 1);
        hijriInput.value = settings.hijriOffset;
        updateUI();
    });

    hijriInput.addEventListener("input", (e) => {
        settings.hijriOffset = clampMinutes(e.target.value);
        updateUI();
    });

    // ============================================================
    // 8. إبقاء الشاشة مضاءة ومنع النوم
    // ============================================================
    function keepScreenOn() {
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
        // منع الشاشة من الإطفاء عبر meta
        const meta = document.createElement('meta');
        meta.name = 'keepalive';
        meta.content = 'true';
        document.head.appendChild(meta);
    }

    // ============================================================
    // 8.5 التصغير التلقائي لمنع خروج المحتوى عن الشاشة
    // ============================================================
    const fitContentEl = document.getElementById('fit-content');
    function fitScreen() {
        }
    
    window.addEventListener('resize', fitScreen);
    window.addEventListener('orientationchange', () => setTimeout(fitScreen, 200));

    // ============================================================
    // 9. بدء التشغيل
    // ============================================================
    loadSettings();
    loadTheme();
    updateUI();
    fitScreen();
    setInterval(updateUI, 1000);
    setInterval(fitScreen, 3000);
    keepScreenOn();

    // إعادة تحميل الصفحة في حالة أي خطأ
    window.addEventListener('error', function() {
        setTimeout(() => location.reload(), 3000);
    });

    console.log('🕌 شاشة مواقيت الصلاة - كركوك تعمل بنجاح');
})();
